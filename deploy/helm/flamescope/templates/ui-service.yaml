apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    {{- include "flamescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "flamescope.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
