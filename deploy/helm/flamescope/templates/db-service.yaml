apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "flamescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  selector:
    {{- include "flamescope.selectorLabels" (dict "root" $ "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.db.port }}
      targetPort: postgres
