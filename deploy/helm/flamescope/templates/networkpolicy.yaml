{{- if .Values.networkPolicy.enabled }}
# db accepts only api and ingest; api accepts only ui; ui accepts any client (ingress or route).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db
  labels:
    {{- include "flamescope.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flamescope.selectorLabels" (dict "root" $ "component" "db") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "flamescope.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "flamescope.selectorLabels" (dict "root" $ "component" "ingest") | nindent 14 }}
      ports:
        - port: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels:
    {{- include "flamescope.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flamescope.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "flamescope.selectorLabels" (dict "root" $ "component" "ui") | nindent 14 }}
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui
  labels:
    {{- include "flamescope.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flamescope.selectorLabels" (dict "root" $ "component" "ui") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
{{- end }}
