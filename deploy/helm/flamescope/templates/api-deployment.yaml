apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "flamescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "flamescope.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flamescope.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- include "flamescope.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "flamescope.image" (dict "root" $ "image" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "flamescope.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: flamescope-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flamescope-db
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # Same check as the compose health check (document 11 section 1).
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: raw
              mountPath: {{ .Values.paths.rawDir }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: raw
          persistentVolumeClaim:
            claimName: raw
        - name: tmp
          emptyDir: {}
