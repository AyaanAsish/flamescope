[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flamescope"
version = "0.1.0"
description = "FlameScope: AI-assisted dashboard over NASA PSI combustion investigations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]>=3.1",
  "pgvector",
  "structlog",
  "typer",
  "boto3",
  "httpx",
  "pypdf",
  "pdfplumber",
  "openpyxl",
  "pyyaml",
  "google-adk",
  "litellm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-order",
  "pytest-cov",
  "pytest-html",
  "respx",
  "httpx",
  "playwright",
  "ruff",
  "mypy",
  "radon",
  "xenon",
]
# Generated decks in docs/decks/ (doc 02 sections 3 and 4); not a runtime dependency.
docs = [
  "python-pptx",
]

[project.scripts]
flamescope-ingest = "flamescope_ingest.cli:app"

# Explicit package directories keep discovery tolerant while sibling packages are
# being added; every directory listed here is part of the document 02 section 4 layout.
[tool.hatch.build.targets.wheel]
packages = [
  "src/common/flamescope_common",
  "src/agents/flamescope_agents",
  "src/api/flamescope_api",
  "src/ingest/flamescope_ingest",
]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src/common", "src/agents", "src/api", "src/ingest"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src/common", "src/agents", "src/api", "src/ingest", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "S", "A", "C4", "RET", "ARG", "PTH", "RUF"]
extend-select = ["C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]
"src/common/flamescope_common/migrations/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["flamescope_common", "flamescope_agents", "flamescope_api", "flamescope_ingest"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["src/common", "src/agents", "src/api", "src/ingest"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yaml", "boto3", "botocore.*", "pdfplumber", "pgvector.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "unit: fast tests with no Docker or network",
  "integration: tests that need the deployed stack",
  "e2e: browser tests against the running stack",
  "lifecycle: build, deploy and undeploy steps",
  "slow: long-running tests",
  "ollama: needs a live Ollama on the host",
]
# LiteLLM's own TypedDicts trigger a Pydantic notice on import; it is third-party and harmless.
filterwarnings = [
  "ignore:Item '.*' on TypedDict class 'ChatCompletion.*' is using the `ReadOnly` qualifier:UserWarning",
]
