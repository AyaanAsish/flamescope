acronym: SAFFIRE-II
title: Spacecraft Fire Experiment-II
project: null
platform: ISS
gravity_level: mixed
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-99
hardware: []
summary: >
  Saffire-II burned nine 5 cm x 29 cm samples (Sibal fabric, silicone, structural PMMA, flat PMMA and PMMA with Nomex)
  in the Cygnus pressurized cargo module after it left the ISS, in concurrent or opposed air flow of 20 or 30 cm/s, to
  compare low-gravity flammability limits with NASA's normal-gravity material screening test.
objectives:
  - text: Measure how quickly a large-scale fire grows in low gravity and compare low-gravity flammability limits with those of NASA's normal-gravity material flammability screening test.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-99
      title: PSI investigation PSI-99, Spacecraft Fire Experiment-II
      locator: Objectives (PSI repository search record, geode-py API)
approach:
  text: A sample card with nine 5 cm x 29 cm samples in the Saffire flow duct on Cygnus after it deberthed from the ISS, with air flow of 20 or 30 cm/s, concurrent or opposed depending on the sample.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: 9 samples, each 5 cm x 29 cm.
fuels:
  - {name: cotton-fiberglass (SIBAL), phase: solid, material_class: fabric, geometry: {shape: flat sample, dimensions_mm: {width: 50, length: 290}}, source: &mat
      {kind: psi_page, uri: "https://psi.nasa.gov/physci/repo/data/investigations/PSI-99", title: "PSI investigation PSI-99, Spacecraft Fire Experiment-II",
       locator: "Approach (PSI repository search record, geode-py API)", quote: "SIBAL, silicone, structure PMMA, flat PMMA, and PMMA with Nomex."}}
  - {name: silicone, phase: solid, material_class: polymer, geometry: {shape: flat sample, dimensions_mm: {width: 50, length: 290}}, source: *mat}
  - {name: PMMA, phase: solid, material_class: polymer, geometry: {shape: flat and structural samples, dimensions_mm: {width: 50, length: 290}}, source: *mat}
  - {name: PMMA with Nomex, phase: solid, material_class: polymer, geometry: {shape: flat sample, dimensions_mm: {width: 50, length: 290}}, source: *mat}
conditions:
  o2_fraction:
    min: 0.215
    max: 0.221
    source:
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-99
      title: PSI-99 Experimental table (PSI-99_Experimental table_SAFFIRE-2.csv)
      locator: Experimental table PSI-99_Experimental table_SAFFIRE-2.csv, column "Percent O2 (Note 1)", minimum ~21.5 (row 1), maximum ~22.1 (rows 2 to 7); Note 1 says derived from measured CO2 production
      quote: 2-2,Silicone,0.61 mm,29 cm,5 cm,20 cm/s,~ 22.1,80 W,9.2 s,Insignificant,Concurrent,~ 0,n/a,7.6 cm,1.2 mm/s,n/a,S2C2
  pressure_kpa: null
  flow_speed_cm_s:
    min: 20
    max: 30
    source: &flow
