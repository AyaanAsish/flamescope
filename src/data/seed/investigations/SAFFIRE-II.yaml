documents:
  - title: Saffire-II PSI overview (approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-99
    section: PSI repository record
    text: >
      Spacecraft Fire Experiment-II (SAFFIRE-II). PSI accession PSI-99. Hardware: Cygnus Pressurized Cargo Module
      SAFFIRE. The PSI record states that the experiment ran on the Cygnus resupply vehicle after it deberthed from the
      ISS and added samples to Saffire-I: "SIBAL, silicone, structure PMMA, flat PMMA, and PMMA with Nomex." The sample
      card held "9 samples, each 5 cm x 29 cm." Air flow was "either 20 or 30 cm/s", concurrent or opposed depending on
      the sample. Sensors recorded "pressure, CO2 and O2 mole faction." Research impacts: "The Saffire-II experiment
      provides a new way to study a realistic fire on an exploration vehicle, which has not been pos[sible] [...]".
      "Instruments on an unmanned cargo vessel measure oxygen, carbon dioxide, heat, pressure and flame growth, and two
      video [...]".
open_questions:
  - Added from the PSI combustion catalog (PSI-99). Runs are the nine samples (2-1 to 2-9) of PSI-99_Experimental table_SAFFIRE-2.csv, each twice, as the flight burn (0 g, PSI Microgravity Investigation, flight platform Cygnus Spacecraft) and the table's normal-gravity reference columns "1-g Burn Length" and "1-g Spread Rate" (1 g). They replace the four per-material aggregates from the PSI approach.
  - Every table row lists 20 cm/s, while the PSI approach says "either 20 or 30 cm/s" depending on material; the card keeps the approach range and no run is given 30 cm/s.
  - The flight columns are headed "?-g Burn Length" and "?-g Spread Length" in the PSI file (the symbol is lost); they are read as the flight counterpart of the 1-g columns. Spread rates such as "2.1 mm/s" become flame_spread_rate_mm_s; "Acceleratory", "Complete", "~ 0" and "n/a" stay in notes.
  - The 1-g reference runs state no oxygen, flow speed or flow direction; those stay null. Samples 2-6 and 2-9 have a blank Material cell, so their fuel is null. Thickness "037 mm" (samples 2-4 to 2-6) and "See Fig. 5" are not converted.
  - PSI states the flight platform as "Cygnus Spacecraft", which the platform vocabulary does not hold; platform stays ISS as for SAFFIRE-I and -III, whose PSI records name the ISS. Cabin pressure is not in the table.
