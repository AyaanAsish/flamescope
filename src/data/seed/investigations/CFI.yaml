documents:
  - title: CFI PSI overview (objectives, approach, hypothesis, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-39
    section: PSI repository record
    text: >
      Cool Flames Investigation (CFI). PSI accession PSI-39. Hardware: Multi-User Droplet Combustion Apparatus (MDCA),
      Combustion Integrated Rack (CIR); sub-research area: Droplets; space program: ISS National Laboratory - National
      Science Foundation. Objectives: "1) Examine the combustion behavior of n-dodecane and mixtures of
      n-dodecane/iso-dodecane at pressures ranging from 0.25 atm to 5 atm." "2) Analyze the effects of helium dilution on
      cool flame behavior." "3) Examine the behavior of combustion characteristics." Approach: "A system of gas bottles
      and fuel syringes delivers the desired gas mixture to the combustion chamber ranging from 0.25 to 0.5 atm."
      "Droplets of fuel are dispensed and suspended between hypodermic needles or tethered using silicon-carbide
      fibers." "A hot-wire igniter is positioned near the droplet for ignition." "Fuels observed include n-dodecane,
      farnesane, and mixtures of n-dodecane/iso-dodecane." Research impacts: "A basic understanding of cool flames is
      important for understanding ignition phenomena of practical fuels and fuel addit[ives] [...]". "Cool flames play a
      key role in the development and selection of new fuels and the design of advanced engines such as [...]". "Cool
      Flames Investigation (CFI) will provide critical validation for complex chemical kinetic mechanisms [...]".
open_questions:
  - The PSI record gives two pressure ranges (objectives 0.25 to 5 atm, approach 0.25 to 0.5 atm); the card keeps the objectives range. The experimental table runs span 0.5 to 5 atm, so the two aggregate runs (objectives range) are kept for the stated 0.25 atm end that no table row covers.
  - Individual runs are the 79 distinct rows of PSI-39_Experimental table_CFI.csv; 8 rows (tests 1285 to 1289 and 1295 to 1297) appear twice with identical cells and are imported once. Pressure is converted from atm at 101.325 kPa per atm; diluent is N2, or N2+He where the Helium column is non-zero; the Fiber column (fiber-supported droplet) is a fixed parameter.
  - The table states no droplet diameter, burning rate, cool-flame or extinction result per test; those stay null. Tests 1219 to 1222 list O2 0.21 and N2 0.76 with He 0 (fractions do not sum to 1); copied unchanged.
  - Farnesane appears in the PSI approach but not in the experimental table; it has no runs.
