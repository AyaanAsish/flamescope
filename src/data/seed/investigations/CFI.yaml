acronym: CFI
title: Cool Flames Investigation
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-39
hardware:
  - {name: CIR, role: host}
  - {name: MDCA, role: apparatus}
summary: >
  CFI burned single droplets of n-dodecane, farnesane and n-dodecane/iso-dodecane mixtures in the Multi-user Droplet
  Combustion Apparatus of the Combustion Integrated Rack on the ISS to study cool-flame behaviour, the effect of helium
  dilution and the link between droplet size, pressure and extinction. Droplets were suspended between needles or
  tethered on silicon-carbide fibres and ignited with a hot wire.
objectives:
  - text: Examine the combustion behavior of n-dodecane and mixtures of n-dodecane/iso-dodecane at pressures ranging from 0.25 atm to 5 atm.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-39
      title: PSI investigation PSI-39, Cool Flames Investigation
      locator: Objectives (PSI repository search record, geode-py API)
      quote: 1) Examine the combustion behavior of n-dodecane and mixtures of n-dodecane/iso-dodecane at pressures ranging from 0.25
  - text: Analyze the effects of helium dilution on cool flame behavior.
    source:
      <<: *psi_record
      quote: 2) Analyze the effects of helium dilution on cool flame behavior.
  - text: Investigate the relationship between droplet size, pressure, and flame extinction [...]
    source:
      <<: *psi_record
      quote: 4) Investigate the relationship between droplet size, pressure, and flame extinction, and (5) understand the
approach:
  text: >
    Gas bottles and fuel syringes deliver the gas mixture to the MDCA combustion chamber; fuel droplets are dispensed
    and suspended between hypodermic needles or tethered on silicon-carbide fibres and ignited by a hot-wire igniter.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: Droplets of fuel are dispensed and suspended between hypodermic needles or tethered using silicon-carbide fibers.
fuels:
  - {name: n-dodecane, phase: liquid, material_class: alkane, geometry: {shape: droplet, dimensions_mm: {}}, source: &fuels
      {kind: psi_page, uri: "https://psi.nasa.gov/physci/repo/data/investigations/PSI-39", title: "PSI investigation PSI-39, Cool Flames Investigation",
       locator: "Approach (PSI repository search record, geode-py API)", quote: "Fuels observed include n-dodecane, farnesane, and mixtures of n-dodecane/iso-dodecane."}}
  - {name: farnesane, phase: liquid, material_class: alkane, geometry: {shape: droplet, dimensions_mm: {}}, source: *fuels}
  - {name: n-dodecane / iso-dodecane, phase: liquid, material_class: alkane, geometry: {shape: droplet, dimensions_mm: {}}, source: *fuels}
