acronym: s-Flame
title: Structure and Response of Spherical Diffusion Flames
project: ACME
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-23
hardware:
  - {name: CIR, role: host}
  - {name: ACME insert, role: apparatus}
summary: >
  s-Flame, an ACME experiment in the Combustion Integrated Rack, issued hydrogen, methane, hydrogen/methane mixtures and
  ethylene with nitrogen or helium diluent from a porous spherical burner to measure the transient structure and the
  extinction limits of spherical diffusion flames for comparison with detailed simulations. Radiative extinction
  appeared at high flow rates and kinetic extinction at low flow rates.
objectives:
  - text: Measure and characterize the transient structure (such as temperature and species distribution) of diffusion flames [...]
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-23
      title: PSI investigation PSI-23, ACME Structure and Response of Spherical Diffusion Flames
      locator: Objectives (PSI repository search record, geode-py API)
      quote: (A) Measure and characterize the transient structure (such as temperature and species distribution) of diffusion flames
  - text: Determine the quasi-steady convective/chemical-kinetic extinction limits (low system Damköhler numbers) [...]
    source:
      <<: *psi_record
      quote: (B) Determine the quasi-steady convective/chemical-kinetic extinction limits (low system Damköhler numbers) and
approach:
  text: Mixtures of gaseous fuels and diluents are issued from a spherical burner; synchronized spectrally resolved images and flame and burner temperatures are compared with detailed numerical simulations.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: These data are to be used for comparisons of flame behavior and structure with detailed numerical simulations of the flames.
