findings:
  - statement: Radiative extinction of spherical diffusion flames seemed to occur at high flow rates and kinetic extinction at low flow rates.
    category: fundamental
    source: &jasmac
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210021781
      title: Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)
      locator: s-Flame section, conference paper full text
      quote: Radiative extinction seems to occur at high flow rates and kinetic extinction at low flow rates.
    confidence: 0.75
  - statement: Using helium rather than nitrogen to dilute both fuel and oxygen shifted the extinction limits.
    category: fundamental
    source:
      <<: *jasmac
      quote: With helium, rather than nitrogen, dilution of both the fuel and oxygen, the extinction limits are shifted
    confidence: 0.7
