documents:
  - title: s-Flame PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-23
    section: PSI repository record
    text: >
      Advanced Combustion via Microgravity Experiments-Structure and Response of Spherical Diffusion Flames (ACME
      s-Flame). PSI accession PSI-23. Project type: Microgravity Investigation; flight platform: International Space
      Station (ISS); hardware: Combustion Integrated Rack (CIR), ACME. Objectives: "(A) Measure and characterize the
      transient structure (such as temperature and species distribution) of diffusion flames [...]". "(B) Determine the
      quasi-steady convective/chemical-kinetic extinction limits (low system Damköhler numbers) and [...]". Approach:
      "These data are to be used for comparisons of flame behavior and structure with detailed numerical simulations of
      the flames." "Conventional gaseous fuels including hydrogen, methane, and ethylene will be used." "Hydrogen is the
      simplest fuel and its reaction mechanism is also reasonably established." Research impacts: "The impact of this
      work consists of both practical and fundamental aspects."
  - title: Recent Research on Flames of Gaseous Fuel Aboard the ISS, s-Flame excerpts (verbatim)
    uri: https://ntrs.nasa.gov/citations/20210021781
    section: conference paper, s-Flame section
    text: >
      "This study's goal is to advance our ability to predict the structure and dynamics of non-premixed spherical
      flames". "The fuel gases included hydrogen, methane, hydrogen/methane mixtures, and ethylene". "Tests were
      conducted with either nitrogen or helium as the diluent in both the fuel and chamber atmosphere." "Radiative
      extinction seems to occur at high flow rates and kinetic extinction at low flow rates." "With helium, rather than
      nitrogen, dilution of both the fuel and oxygen, the extinction limits are shifted". ISS operations: "July
      2019–Jan. 2020"; "April-July 2020".
open_questions:
  - Added from the PSI combustion catalog (PSI-23).
  - Runs are the 18 test days of PSI-23_Experimental table_ACME s-Flame.csv, one run per stated oxygen level (days listing "~30% and ~21%" give two runs); oxygen and pressure are approximate ("~") and the table notes that pressure rises and O2 falls with vitiation.
  - The Atmosphere and Fuel Bottle cells increment N2, N3, N4 ... (a spreadsheet fill); the diluent is read as N2. Fuel flow rates and per-flame extinction results are not in the table; outcome.ignited only reflects the number of flames ignited per day.
  - Publications are the PSI record list (many predate the flight); years are taken from PSI titles only where given.
  - Hydrogen has no material class in fuel_taxonomy.yaml; left null.
