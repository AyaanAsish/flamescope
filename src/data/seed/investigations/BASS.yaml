documents:
  - title: BASS PSI overview (objectives, approach, hypothesis, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-26
    section: PSI repository record
    text: >
      Title: Burning and Suppression of Solids (BASS). PSI accession PSI-26; PSI dataset DOI 10.60555/58h4-dy80.
      Project type: Microgravity Investigation; flight platform: International Space Station (ISS); hardware:
      Microgravity Science Glovebox; sub-research area: Spacecraft Fire Safety. Objectives: "The two main objectives
      for BASS are to:" "1.) Begin to bridge the gap between the normal gravity NASA-STD-6001 Test#1 method,
      ground-based microgravity tests, and [...]" "2.) Assess the effectiveness of an inert, gaseous extinguishing
      agent (similar to that used on ISS) in putting out [...]". Approach: "The experiment was conducted aboard the
      International Space Station (ISS) inside the Microgravity Glove Box (MSG)." "A Kanthal wire (29-gage)igniter was
      used to initiate combustion at one end of the fabric." "Airflow was controlled using a variable speed fan, with
      airflow speeds reaching as high as 40 cm/s." "The airflow was directed along the fuel surface in either the
      opposed or concurrent direction." "The samples were placed in a small flow duct (76 mm x 76 mm cross section)
      that allowed for airflow across the fabric." "Other sample shapes were utilized as well including spheres and
      cylinders." Hypothesis: "To test this hypothesis with any but the thinnest materials requires extended
      microgravity time – longer than available in drop towers or parabolic aircraft." Research impacts: "A critical
      element of this understanding is the radiative heat emission from the flame." "Using nitrogen as a flame
      suppressant in microgravity provides a direct link to current and planned extinguishment techniques." "BASS
      results provide essential guidance to ground-based microgravity combustion research efforts." "Detailed
      combustion models are validated using the simpler flow environment afforded by tests in microgravity."
      The experimental table (PSI-26_Experimental table_BASS.csv) lists 122 rows with date, GMT, as-run test number,
      test number, sample number and fuel sample material.
  - title: Thickness and Fuel Preheating Effects on Material Flammability in Microgravity from the BASS Experiment (abstract, verbatim excerpts)
    uri: https://ntrs.nasa.gov/citations/20140011099
    section: abstract
    text: >
      "The Burning and Suppression of Solids (BASS) experiment was performed on the International Space Station."
      "Microgravity combustion tests burning thin and thick flat samples, acrylic spheres, and candles were conducted."
      "The samples were mounted inside a small wind tunnel which could impose air flow speeds up to 40 cms." "In some
      cases, a jet of nitrogen was introduced to attempt to extinguish the flame." "Microgravity flames were found to be
      especially sensitive to air flow speed in the range 0 to 5 cms." "At the lowest speeds examined (less than 1 cms)
      all the flames tended to become dim blue and very stable." "However, heat loss at these very low convective rates
      is small so the flames can burn for a long time." "This has implications for spacecraft fire safety since a tiny
      flame might be undetected for a long time."
open_questions:
  - Individual runs are the 121 test rows of PSI-26_Experimental table_BASS.csv (the "SOOT Cleaning" row is skipped); the table lists only date, test numbers, sample number and material text, so run oxygen, pressure and flow are null (flow direction "opposed" only where the cell says so). The two aggregate runs from the PSI approach and NTRS abstract are kept because they carry the stated flow range.
  - Unlabelled spheres and slabs ("2 cm sphere", "pmma slab") are recorded as PMMA because the NTRS abstract names acrylic spheres and flat samples; sizes such as "2 cm" stay in notes because the cell does not say which dimension is meant. Wax materials are kept as the table names them (paraffin wax, Japan wax, unnamed wax, candle).
  - The candle fuel material is not named beyond "candles"; recorded as candle wax with no material class.
  - Publication years and authors are not given in the PSI record lines opened; left null.
