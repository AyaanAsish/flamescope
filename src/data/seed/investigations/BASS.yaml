findings:
  - statement: Microgravity flames over solids were especially sensitive to air flow speed between 0 and 5 cm/s.
    category: fundamental
    source:
      <<: *ntrs_bass
      quote: Microgravity flames were found to be especially sensitive to air flow speed in the range 0 to 5 cms.
    confidence: 0.8
  - statement: At the lowest flow speeds (below 1 cm/s) flames became dim blue and very stable and, with small heat losses, could burn for a long time.
    category: fundamental
    source:
      <<: *ntrs_bass
      quote: At the lowest speeds examined (less than 1 cms) all the flames tended to become dim blue and very stable.
    confidence: 0.8
  - statement: A tiny flame might go undetected for a long time and could flare up if the air flow increases, which matters for spacecraft fire detection.
    category: detection
    source:
      <<: *ntrs_bass
      quote: This has implications for spacecraft fire safety since a tiny flame might be undetected for a long time.
    confidence: 0.75
  - statement: Using nitrogen as a flame suppressant in microgravity links BASS to current and planned ISS extinguishment techniques.
    category: suppression
    source:
      <<: *psi_record
      locator: Research Impacts/Earth Benefits (PSI repository search record, geode-py API)
      quote: Using nitrogen as a flame suppressant in microgravity provides a direct link to current and planned extinguishment techniques.
    confidence: 0.6
