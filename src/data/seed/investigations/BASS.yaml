      title: PSI investigation PSI-26, Burning and Suppression of Solids
      locator: Objectives (PSI repository search record, geode-py API)
      quote: 1.) Begin to bridge the gap between the normal gravity NASA-STD-6001 Test#1 method, ground-based microgravity tests, and
  - text: Assess the effectiveness of an inert, gaseous extinguishing agent (similar to that used on ISS) in putting out [...]
    source:
      <<: *psi_record
      quote: 2.) Assess the effectiveness of an inert, gaseous extinguishing agent (similar to that used on ISS) in putting out
approach:
  text: >
    Fabric and other samples were placed in a small flow duct (76 mm x 76 mm cross section) in the Microgravity
    Science Glovebox, ignited with a Kanthal wire, and burned in opposed or concurrent air flow of up to 40 cm/s.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: Airflow was controlled using a variable speed fan, with airflow speeds reaching as high as 40 cm/s.
