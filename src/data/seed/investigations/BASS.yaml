acronym: BASS
title: Burning and Suppression of Solids
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-26
hardware:
  - {name: MSG, role: host}
  - {name: SPICE flow duct, role: apparatus}
summary: >
  BASS burned cotton-fiberglass fabric, thin and thick flat samples, acrylic spheres and candles in a small flow duct
  (76 mm x 76 mm cross section) inside the Microgravity Science Glovebox on the ISS, with fan-driven air flow up to
  40 cm/s in opposed or concurrent direction, and tested a nitrogen jet as an extinguishing agent. Flames were most
  sensitive to flow below 5 cm/s, and tiny dim flames could persist undetected for a long time.
objectives:
  - text: Begin to bridge the gap between the normal-gravity NASA-STD-6001 Test 1 method, ground-based microgravity tests and [...]
    source: &psi_record
      kind: psi_page
