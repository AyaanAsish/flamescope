summary: A PSI-funded ground investigation (University of South Carolina, 2017-2022) that built a 3-D OpenFOAM model of n-alkane
  droplet cool flames in microgravity, validated it against ISS FLEX (PSI-69) measurements, and mapped how imposed convection
  and heating govern cool-flame ignition, oscillation, transition to hot ignition and extinction. It holds no new flight tests.
