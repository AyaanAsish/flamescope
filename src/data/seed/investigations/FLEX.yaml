summary: 'FLEX burned single methanol and n-heptane droplets in the Multi-user Droplet Combustion Apparatus of the
  Combustion Integrated Rack on the ISS to map the flammability limits of liquid fuels in microgravity and to quantify
  how well inert-gas suppressants work. Its PSI experimental table lists 274 tests with ambient pressure, initial
  O2/N2/CO2/He mole fractions, droplet diameters, burning rates, burn times and how each test ended.

  '
