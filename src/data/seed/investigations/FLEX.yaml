documents:
- title: FLEX PSI overview (objective, approach, hypothesis, research impacts; verbatim excerpts)
  uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-69
  section: PSI repository record
  text: 'Title: Flame Extinguishment Experiment (FLEX). PSI accession PSI-69; PSI dataset DOI 10.60555/mbq8-0451.
    Project type: Microgravity Investigation; flight program: International Space Station (ISS); hardware: Combustion
    Integrated Rack (CIR)-Fluids and Combustion Facility (FCF), Multi-user Droplet Combustion Apparatus (MDCA);
    sub-research area: Spacecraft Fire Safety. Objective: "The FLEX (Flame Extinguishment Experiment) investigation
    aims to map the flammability limits of liquid fuels in [...]". Approach: "The FLEX experiments involve igniting
    and observing the burning behavior of relatively large droplets." "A primary objective of the experiments is
    to determine the Limiting Oxygen Index (LOI) as a function of ambient pressure [...]". Hypothesis: "The primary
    hypothesis of the FLEX mission is that microgravity conditions fundamentally alter the combustion and [...]".
    "Specifically, the hypothesis posits that the lack of buoyant convection in microgravity will lead to significant
    [...]". Research impacts: "The research impacts and Earth benefits of the FLEX mission are significant and multifaceted."
    "By enhancing our understanding of microgravity combustion, the mission directly contributes to improved fire
    safety [...]". "On Earth, the insights gained from these experiments have the potential to advance fire safety
    in confined and [...]". The experimental table PSI-69_Experimental table_FLEX.csv has the columns: FLEX Test
    #, FLEX Identifier, Test Date, Test GMT, Fuel, Ambient pressure (mmHg), O2, N2, CO2 and He initial ambient mole
    fractions, droplet initial diameter (mm), visible flame extinction diameter (mm), burning rate, burn time (s)
    and test end (Extinction, Disruption or Completion), for 274 tests of methanol and heptane droplets.

    '
- title: Detailed Results from the Flame Extinguishment Experiment (FLEX), NASA/TP-2015-216046 (abstract excerpts)
  uri: https://ntrs.nasa.gov/citations/20150023456
  section: abstract
  text: '"The Flame Extinguishment Experiment (FLEX) program is a continuing set of experiments on droplet combustion,
    performed [...]". "This report describes the experimental hardware, the diagnostic equipment, the experimental
    procedures, and the methods [...]". "It also presents the results of the first 284 tests performed." "The intent
    is not to interpret the experimental results but rather to make them available to the entire scientific [...]".

    '
- title: Cool-flame Extinction During N-Alkane Droplet Combustion in Microgravity (abstract excerpts)
  uri: https://ntrs.nasa.gov/citations/20140006750
  section: abstract
  text: '"Recent droplet combustion experiments onboard the International Space Station (ISS) have revealed that
    large n-alkane [...]". "The oxygen concentration in these tests varied in the range of 14% to 25% by volume."
    "Large n-alkane droplets exhibited quasi-steady low-temperature burning and extinction following radiative extinction
    of [...]". "A vapor-cloud formed in most cases slightly prior to or following the "cool flame" extinction."
    "Time histories of radiant emission from the droplet captured using broadband radiometers are also presented."

    '
