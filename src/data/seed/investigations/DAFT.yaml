summary: >
  DAFT tested on the ISS whether a TSI P-Trak particle counter, modified to recycle its alcohol by capillary forces,
  works accurately in microgravity, to reduce risk for the Smoke Aerosol Measurement Experiment (SAME). Arizona Red
  Dust aerosol in Mylar bags served as a standard, with a DustTrak as the control. DAFT also gave the first
  measurements of background particulate in the ISS cabin, which was found to be very clean.
objectives:
  - text: The focus of DAFT / DAFT-2 was to mitigate the risk for the Smoke Aerosol Measurement Experiment (SAME).
    source: &psi_record
      kind: psi_page
