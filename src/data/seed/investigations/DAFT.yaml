      was found to be a very clean environment with particulate levels substantially below the space shuttle and [...]".
open_questions:
  - PSI holds DAFT and DAFT-2 in one record (PSI-47); this file and DAFT-2.yaml share its text. Which tests belong to DAFT versus DAFT-2 is not separated in the sources opened.
  - DAFT burned nothing (dust aerosol standard), so fuels and conditions are empty. The two runs are the sessions D1 and D2 of PSI-47_Experimental table_DAFT.csv (2005, modified P-Trak and DustTrak with Arizona Road Dust); they are filed under DAFT because the table is named DAFT, and carry only gravity 0 g and the session text.
  - The shared smoke and dust instrument is named in PSI as the TSI P-Trak; the hardware catalog keeps its working name.
