documents:
  - title: DAFT / DAFT-2 PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-47
    section: PSI repository record
    text: >
      Dust and Aerosol Measurement Feasibility Test / Dust and Aerosol Measurement Feasibility Test-2 (DAFT / DAFT-2).
      PSI accession PSI-47. Project type: Microgravity Investigation; hardware: TSI P-Trak. Objectives: "The focus of
      DAFT / DAFT-2 was to mitigate the risk for the Smoke Aerosol Measurement Experiment (SAME)." "SAME relied on a
      commercially available condensate nuclei counter, the TSI P-Trak,  to quantify smoke aerosols [...]". "DAFT /
      DAFT-2 tests that a modified P-Trak particulate counter would be accurate in microgravity." Approach: "1)
      Modification of Instrumentation: TSI P-Trak was modified for use in microgravity by redesigning the condenser tube
      [...]". "2) Aerosol Generation: Arizona Red Dust (ARD) was chosen as an aerosol standard due to its ease of
      dispersion." "The ARD was aerosolized with GN2 to create particle samples." Research impacts: "Extended duration
      space flight missions with larger vessels will require fire detection systems with increased reliabili[ty]
      [...]". "This research will impact the development of novel fire and smoke detection systems for the
      International Space Station [...]". "Additionally, the successful adaptation of the TSI P-Trak for microgravity
      can inform the design of instruments for use [...]".
  - title: Particle and Smoke Detection on ISS for Next Generation Smoke Detectors (abstract, verbatim excerpts)
    uri: https://ntrs.nasa.gov/citations/20070031686
    section: abstract
    text: >
      "A precursor experiment (DAFT: Dust Aerosol measurement Feasibility Test) flew recently on the ISS and provided
