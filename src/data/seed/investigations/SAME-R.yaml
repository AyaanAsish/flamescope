documents:
  - title: SAME-R PSI overview (approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-101
    section: PSI repository record
    text: >
      Smoke Aerosol Measurement Experiment-Reflight (SAME-R). PSI accession PSI-101; sub-research area: Spacecraft Fire
      Safety; hardware: Comparitive Soot Diagnostic Hardware. Approach: "SAME-R utilized the SAME hardware used
      on-orbit." "Based on the experience gained from SAME, SAME-R included the following modifications: 1) a new test
      material," "Pyrell®, an intumescent fire-retardant foam by Foamex, was introduced to replace DBP samples," "test
      conditions were broadened including higher heating temperatures and no-flow during sample heating time," "SAME-R
      flight tests were conducted from July 16, to September 9, 2010, successfully completing 66 test points."
      Research impacts: "Along with the results from the original SAME investigation, the results from SAME-R can lead
      to technology for an advan[ced] [...]". "The results from SAME are needed to provide the reduced gravity baseline
      data against which future detection technology [...]". "The smoke detectors developed from the results of SAME can
      also be useful in other extreme environments on Earth, such [...]". "Accurate detection of smoke in these
      environments can save lives."
  - title: Particle Morphology and Size Results from the Smoke Aerosol Measurement Experiment-2 (abstract, verbatim excerpts)
    uri: https://ntrs.nasa.gov/citations/20130000422
    section: abstract
    text: >
      "Results are presented from the Reflight of the Smoke Aerosol Measurement Experiment (SAME-2) which was conducted
      during E[xpedition] [...]". "The air flow past the sample during the heating period ranged from quiescent to 8
      cm/s." "This effective transport time was varied by holding the smoke in the aging chamber for times ranging from
      11 to 1800 s." "Smoke particle samples were collected on Transmission Electron Microscope (TEM) grids for
      post-flight analysis." "The TEM grids were analyzed to observe the particle morphology and size parameters."
      "Overall the majority of the average smoke particle sizes were found to be in the 200 nm to 400 nm range with the
      quiesc[ent] [cases producing some cases with substantially larger particles]".
open_questions:
  - The NTRS paper names the flight SAME-2 ("Reflight of the Smoke Aerosol Measurement Experiment"); it is taken to be SAME-R (PSI-101) because both are the 2010 reflight.
  - Heating temperatures are not stated numerically in the sources opened ("heated to temperatures below the ignition point").
  - Cabin oxygen and pressure during the tests are not stated; left null.
  - Runs are the 109 rows of PSI-101_Experimental table_SAME-R.csv (Kapton, Silicone, Lampwick, Pyrell, Teflon); inlet velocity is the run flow speed, Rt/R0 (heater resistance ratio, the heating-level setting) and net aging time are varied parameters. Rows with an "a" suffix are the aged measurement of the same smoke sample.
  - The table names "Lampwick" where the NTRS abstract names cotton; the cotton aggregate run from the abstract is kept because no table row is labelled cotton, and whether lampwick is that cotton sample is for a curator to confirm.
  - Particle-size results per test are not in the table; outcomes carry only the table text.
