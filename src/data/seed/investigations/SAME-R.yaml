acronym: SAME-R
title: Smoke Aerosol Measurement Experiment-Reflight
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-101
hardware:
  - {name: MSG, role: host}
  - {name: Smoke and dust instrument, role: instrument}
summary: >
  SAME-R reflew the SAME hardware on the ISS (July 16 to September 9, 2010; 66 test points) with a new material
  (Pyrell foam), higher heating temperatures and no-flow heating. Teflon, Kapton, cotton, silicone rubber and Pyrell
  were heated below ignition in air flows from quiescent to 8 cm/s, and the smoke was aged 11 to 1800 s. Most average
  smoke particle sizes were 200 to 400 nm, with larger particles in some quiescent cases.
objectives:
  - text: Measure the growth of liquid smoke droplets in low gravity and relate the size distribution to how the smoke was generated and transported, addressing grid contamination seen in SAME.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-101
      title: PSI investigation PSI-101, Smoke Aerosol Measurement Experiment-Reflight
      locator: Objectives (PSI repository search record, geode-py API)
approach:
  text: >
    SAME-R used the SAME hardware on orbit with a new test material (Pyrell, an intumescent fire-retardant foam,
    replacing DBP samples), broader test conditions including higher heating temperatures and no flow during sample
    heating; flight tests ran from July 16 to September 9, 2010 and completed 66 test points.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: SAME-R flight tests were conducted from July 16, to September 9, 2010, successfully completing 66 test points.
fuels:
  - {name: Teflon, phase: solid, material_class: polymer, geometry: null, source: &mat
      {kind: publication, uri: "https://ntrs.nasa.gov/citations/20130000422", title: "Particle Morphology and Size Results from the Smoke Aerosol Measurement Experiment-2 (Urban et al., 2012)",
       locator: abstract, quote: "Five different materials representative of those found in spacecraft (Teflon, Kapton, cotton, silicone rubber and Pyrel"}}
  - {name: Kapton, phase: solid, material_class: polymer, geometry: null, source: *mat}
  - {name: cotton, phase: solid, material_class: fabric, geometry: null, source: *mat}
  - {name: silicone rubber, phase: solid, material_class: polymer, geometry: null, source: *mat}
  - {name: Pyrell, phase: solid, material_class: polymer, geometry: null, source: *mat}
  - name: lampwick
    phase: solid
    material_class: null
    geometry: null
