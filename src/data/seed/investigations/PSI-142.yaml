documents:
- title: PSI-142 PSI overview (objective, approach, hypothesis, research impacts; verbatim)
  uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-142
  section: PSI repository record
  text: 'Title: Quantitative Studies of Cool Flame Transitions at Radiation / Stretch Extinction Using Counterflow Flames.
    PSI accession PSI-142; PSI dataset DOI 10.60555/80qf-vj95. Project type: Ground Investigation; research area: Combustion
    Science; sub-research area: Spacecraft Fire Safety; managing center: Glenn Research Center (GRC); funding: NNX16AK07G;
    investigation dates 08-01-2016 to 07-31-2021. Related investigations in PSI: PSI-69 (FLEX). Objective: "By using the Flame
    Extinguishment (FLEX) experimental data from the Physical Sciences Informatics (PSI) system of combustion science, the
    purpose of this grant was to conduct new simulations and ground-based experiments using ozone-sensitized counterflow flames
    to: 1) Develop a new diagram of the flammability limits of diffusional cool flames affected by radiation, diffusion, and
    convection. 2) Bridge the knowledge gap between the flammability limits and extinction limits of hot flames and cool flames.
    3) Verify the phenomena observed on the ISS flame extinguishment experiments. 4) Obtain new, quantitative data of extinction
    limit, flame temperature, and species distribution for the validation of kinetic and radiation models involving cool flames.
    5) Extend the cool flame experiments from the original ISS droplet experiments to a more general ground-based combustion
    system involving radiation, diffusion, convection, and low-temperature chemistry while maintaining a one-dimensional geometry."
    Approach: "Using the experimental conditions of FLEX flight, a comparative studies of the oxygen concentration effects
    on the extinction limits of cool flames was conducted using three different numerical modeling schemes, (a) spark-assisted
    flame propagation of a n-heptane/air mixture, (b) one dimensional freely-propagating dimethyl ether (DME) flames using
    an arc-length continuation method and (c) simulated cool flame regimes and burning limits at elevated pressure (up to
    20 atm) using DME/air mixtures. Specific research details are outlined in the publication, ''''Dynamics of cool flames''''
    [https://doi.org/10.1016/j.pecs.2019.100787]; '''' Understanding Cool Flames and Warm Flames'''', [https://doi.org/10.1016/j.proci.2020.09.019]
    and ''''Study of the low-temperature reactivity of large n-alkanes through cool diffusion flame extinction'''', [https://doi.org/10.1016/j.combustflame.2017.01.028]."
    Hypothesis: "This investigation attempts to answer the critical question as to what conditions causes the hot flames transfer
    to cool flames and how the cool flame flammable region is related to hot flame flammability limit and extinction limit.
    The investigation hypothesizes that factors such as oxygen concentration, dilution, pressure, diffusion, and convection
    transport processes affect the cool flame transition." Research impacts: "Obtaining a fundamental understanding of the
    warm diffusion flame is particularly relevant to combustion in highly turbulent flow fields and in microgravity environments,
    owing to the possibility of long residence times. The results showed that the warm flame has a double reaction zone structure
    and plays a critical role in the transition between cool flames and hot flames. At elevated pressures, it was found that
    the flammable region of warm flames and cool flames expands due to the increase in low-temperature and intermediate-temperature
    reactivity with pressure. Since many real engines operate in the 20-40 atm pressure range, therefore, cool flames and
    warm flames are relevant and important flame regimes for high-pressure near-limit combustion applications. These calculations
    from this investigation will serve to advance the understanding of near-limit flame dynamics and provide guidance for
    experimental observation of different flame regimes."'
