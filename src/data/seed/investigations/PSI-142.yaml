summary: A NASA-funded ground investigation (Princeton University, 2016-2021) that used FLEX (PSI-69) flight conditions to
  guide ozone-sensitized counterflow flame experiments and simulations of cool, warm and hot diffusion flames, to map cool-flame
  flammability and extinction limits. Its experiments ran in a ground laboratory; its PSI data summary points to figures in
  the publications rather than to test conditions.
