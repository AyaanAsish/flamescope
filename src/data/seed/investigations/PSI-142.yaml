open_questions:
- 'Ground investigation (PSI Project Type "Ground Investigation"): it re-analyses or models flight data and has no flight
  runs of its own; no runs are seeded and no run conditions are invented.'
- PSI lists the related investigations PSI-69 (FLEX); the card schema has no related-investigation field, so the link is kept
  in the summary and the overview document.
- The acronym key is the PSI accession because PSI gives the investigation no acronym (doc 06 section 5 key rule).
- The PSI experimental table lists eight analysed data sets by publication figure, without test conditions; counterflow conditions
  (ozone level, strain rate, pressure) stay null until the publications are read.
- Experiment hardware is "Principal Investigator Laboratory Hardware", which is not in hardware.yaml; hardware left empty.
- The phase of dimethyl ether is not stated by the source; gas is its state in the DME/air mixtures named and needs curator
  confirmation.
