acronym: SPICE
title: Smoke Point In Co-flow Experiment
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-107
hardware:
  - {name: MSG, role: host}
  - {name: SPICE flow duct, role: apparatus}
summary: >
  SPICE determined the smoke point (the onset of soot emission) of small laminar gas-jet flames in a co-flowing air
  stream in the Microgravity Science Glovebox on the ISS. Methane, ethylene, propane, propylene and propylene mixtures
  were burned on burners of 0.41, 0.76 and 1.6 mm diameter at co-flow velocities from 5.4 to 65 cm/s; 526 flames were
  studied.
objectives:
  - text: Quantify the sooting propensity of different fuels, such as ethylene, propane, and propylene mixtures.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-107
      title: PSI investigation PSI-107, Smoke Point In Co-flow Experiment
      locator: Objectives (PSI repository search record, geode-py API)
      quote: Quantify the sooting propensity of different fuels, such as ethylene, propane, and propylene mixtures.
  - text: Determine the effects of burner diameter and co-flow velocity on the luminous flame lengths and smoke points.
    source:
      <<: *psi_record
      quote: Determine the effects of burner diameter and co-flow velocity on the luminous flame lengths and smoke points.
  - text: Investigate the impact of air and fuel flow rate variations on smoke point phenomena in space.
    source:
      <<: *psi_record
      quote: Investigate the impact of air and fuel flow rate variations on smoke point phenomena in space.
approach:
  text: >
    Each flame was ignited in a controlled co-flow air environment on burners of 0.41, 0.76 or 1.6 mm diameter at co-flow
    velocities of 5.4 to 65 cm/s, and the fuel flow was adjusted to find the smoke point; flame height, radiative heat
    loss and co-flow velocity distributions were measured.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: Fuel flow rates were adjusted to identify the smoke point, marked by the flame's transition to emitting soot.
fuels:
  - {name: methane, phase: gas, material_class: hydrocarbon gas, geometry: {shape: round gas-jet burner, dimensions_mm: {}}, source: &fuels
      {kind: psi_page, uri: "https://psi.nasa.gov/physci/repo/data/investigations/PSI-107", title: "PSI investigation PSI-107, Smoke Point In Co-flow Experiment",
       locator: "Approach (PSI repository search record, geode-py API)", quote: "Fuels tested included methane, ethylene, propane, propylene, and propylene mixtures."}}
  - {name: ethylene, phase: gas, material_class: hydrocarbon gas, geometry: {shape: round gas-jet burner, dimensions_mm: {}}, source: *fuels}
  - {name: propane, phase: gas, material_class: hydrocarbon gas, geometry: {shape: round gas-jet burner, dimensions_mm: {}}, source: *fuels}
  - {name: propylene, phase: gas, material_class: hydrocarbon gas, geometry: {shape: round gas-jet burner, dimensions_mm: {}}, source: *fuels}
