documents:
  - title: SPICE PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-107
    section: PSI repository record
    text: >
      Title: Smoke Point In Co-flow Experiment (SPICE). PSI accession PSI-107. Project type: Microgravity
      Investigation; flight platform: International Space Station (ISS); hardware: Microgravity Science Glovebox (MSG);
      sub-research area: Fire Safety. Objectives: "Quantify the sooting propensity of different fuels, such as
      ethylene, propane, and propylene mixtures." "Determine the effects of burner diameter and co-flow velocity on the
      luminous flame lengths and smoke points." "Investigate the impact of air and fuel flow rate variations on smoke
      point phenomena in space." Approach: "Fuels tested included methane, ethylene, propane, propylene, and propylene
      mixtures." Burner diameters "of 0.41 mm, 0.76 mm, and 1.6 mm" and "co-flow velocities ranging from 5.4 cm/s to 65
      cm/s". "Fuel flow rates were adjusted to identify the smoke point, marked by the flame's transition to emitting
      soot." "Measurements included flame height, radiative heat losses, and co-flow air velocity distributions." "In
      total 526 flames were studied." Research impacts: "Will improve our understanding of soot formation mechanisms and
      help design safer spacecraft environments." "Will contribute to refining our computational models for predicting
      flame behaviors under non-buoyant conditions."
  - title: Smoke Point in Co-flow Experiment, NASA technical report (abstract, verbatim excerpts)
    uri: https://ntrs.nasa.gov/citations/20090014827
    section: abstract
    text: >
      "Previous experiments show that soot dominates the heat emitted from flames in normal gravity and microgravity
      fires." "These results will be used to support combustion theories and to assess fire behavior in microgravity."
      "Luminous flame shape measurements would also be made to verify models of the flame shapes under co-flow
      conditions." "The Smoke Point In Co-flow Experiment (SPICE) determines the point at which gas-jet flames (similar
      to a butane-lighter [flame] [...]". "Studying a soot emitting flame is important in understanding the ability of
      fires to spread and in control of soot in [...]".
open_questions:
  - Oxygen and pressure are not stated in the sources opened (co-flow of air in the glovebox); left null.
  - Smoke-point results per fuel and burner are not in the sources opened; findings left empty.
  - Runs are the 435 distinct rows of PSI-107_Experimental table_Spice.csv (469 rows; 34 exact duplicate rows imported once); flow speed is the "Air Rate (cm/s)" co-flow, the nozzle size is geometry.dimensions_mm.nozzle and the fuel mass rate is a varied parameter. They replace the four aggregates from the PSI approach (5.4 to 65 cm/s), which the table range (0.66 to 85.28 cm/s) covers; the card keeps the approach range as stated text.
  - Eight rows list a negative air rate (down to -5.92 cm/s) and 20 a blank one; their flow speed is null with the cell kept in notes.
  - The propylene mixtures ("75 % Propylene", "50 % Propylene") do not name the balance gas; runs use fuel propylene with the cell text as a fixed parameter. Smoke-point results are not in the table.
