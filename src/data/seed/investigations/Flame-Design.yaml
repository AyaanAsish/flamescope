findings:
  - statement: Flame size increased with reactant flow rate and decreased with ambient oxygen concentration.
    category: fundamental
    source: &jasmac
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210021781
      title: Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)
      locator: Flame Design section, conference paper full text
      quote: the flame size increases with reactant flow rate and decreases with ambient oxygen concentration
    confidence: 0.8
  - statement: Large flames increased in size over time until they extinguished because of radiative heat loss, while very small flames approached steady state.
    category: fundamental
    source:
      <<: *jasmac
      quote: large flames increase in size over time until the flame extinguishes because of radiative heat loss.
    confidence: 0.8
