summary: >
  Flame Design, an ACME experiment in the Combustion Integrated Rack, studied soot inception and control in normal and
  inverse spherical diffusion flames of ethylene and methane with varied dilution, flow rate, stoichiometric mixture
  fraction and pressure. Flame size grew with reactant flow rate and shrank with ambient oxygen; large flames grew until
  radiative extinction.
