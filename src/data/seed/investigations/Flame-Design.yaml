documents:
  - title: Flame Design PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-10
    section: PSI repository record
    text: >
      Advanced Combustion via Microgravity Experiments / Flame Design (ACME/Flame Design). PSI accession PSI-10. Project
      type: Microgravity Investigation; flight platform: International Space Station (ISS); hardware: ACME, Combustion
      Integrated Rack (CIR), Reconfiguration of CIR. Objectives: "(A) Obtain similar limits and temperatures for inverse
      and normal coflow flames." "(B) Obtain detailed measurements in quasi-steady normal and inverse spherical
      diffusion flames for C2H4 and CH4." "(C) Identify the presence of radiative or kinetic extinction." Approach:
      "Perform spherical diffusion flame tests in drop towers and aboard the International Space Station." "Consider a
      broad range of reactant dilutions, flow rates and pressures for normal and inverse convection directions."
      "Observe the flames with a broad suite of cameras, radiometers, photomultiplier tubes, and thermocouples."
      Research impacts: "This project has the potential for improving efficiency and reducing pollutant emissions in
      terrestrial combustors." "For example, it is contributing to novel designs of future coal power plants."
  - title: Recent Research on Flames of Gaseous Fuel Aboard the ISS, Flame Design excerpts (verbatim)
    uri: https://ntrs.nasa.gov/citations/20210021781
    section: conference paper, Flame Design section
    text: >
      "The primary goal of this experiment is to improve fundamental understanding of soot inception and control".
      "Tests are conducted with various concentrations of ethylene and oxygen". "enable the optimization of
      oxygen-enriched combustion". "the flame size increases with reactant flow rate and decreases with ambient oxygen
      concentration". "Very small flames have low radiative loss and asymptotically approach steady-state behavior."
      "large flames increase in size over time until the flame extinguishes because of radiative heat loss."
      "Although the normal-flame tests have been completed, the inverse-flame testing has yet to begin."
open_questions:
  - Added from the PSI combustion catalog (PSI-10, "ACME/Flame Design"); the acronym key Flame-Design has no spaces.
  - Runs are the 207 normal-flame and 120 inverse-flame rows of the two PSI-10 experimental tables (one run per test ID). Oxygen is XO2 (init) of the ambient for normal flames and the XO2 of the oxidizer issued from the burner for inverse flames (ambient is nitrogen-diluted ethylene); pressure is pinit (atm converted to kPa).
  - Cells marked RAMPED, RAMP or LOW O (flow or composition ramped during the test) are left null; the original text stays in outcome.notes. Adiabatic flame temperature (Tad) and stoichiometric mixture fraction (Zst) are computed table values, kept in notes and varied_parameters, not outcomes.
  - The tables state no ignition or extinction result per test; outcome flags stay null. Methane appears in the PSI objectives but not in the tables.
  - Publications are the PSI record list; years are taken from PSI titles only where given.
reviewed: false
