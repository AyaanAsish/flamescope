documents:
  - title: BRE PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-20
    section: PSI repository record
    text: >
      Title: Advanced Combustion via Microgravity Experiments - Burning Rate Emulator (ACME BRE). PSI accession PSI-20;
      PSI dataset DOI 10.60555/vb93-3y72. Project type: Microgravity Investigation; flight platform: International
      Space Station (ISS); hardware: Combustion Integrated Rack (CIR), ACME. Objectives: "The BRE flight program seeks
      to establish the burning conditions in a quiescent microgravity ambient in terms of [...]". "Observe burning
      behavior in long-duration microgravity for CH4/N2 and C2H4/N2mixtures on porous circular burners of 25 [and 50
      mm diameter]". "Consider O2/N2 ambients with various pressures and ambient O2 concentrations and pressures."
      "NASA - considered atmosphere for human space missions will be examined: 14.7 psia, 21 % oxygen: 10.2 psia,
      26.5 %; and 8.2 psia, 34 % oxygen". "Consider the conditions of Objective 1 for ambients of O2/CO2 (desired)."
      Approach: "For each test, conditions will be established for the chamber contents, namely choice of diluent,
      oxygen concentration, [...]". "Fuel flow will commence followed by ignition." "The flames will initially be
      observed without varying the fuel flow rate." Research impacts: "BRE yielded important data relevant to
      spacecraft fire safety." "Quasi-steady burning corresponding to various condensed-phase materials (such as PMMA
      and Nylon) was observed in [...]". "While BRE's results are still preliminary, they suggest that NASA may want to
      increase use of its alternative flammability [...]". Experimental table (PSI-20_Experimental table_ACME BRE.csv):
      18 test days from February 2019 to January 2021 with burner size 25 or 50 mm, fuel bottle 100% C2H4, 50% C2H4 or
      100% CH4, oxygen concentrations of 21, 25, 26.5, 34 and 40 percent and the number of flames ignited; "The chamber
      pressures were also varied but are not identified in this summary table."
  - title: Burning Rate Emulator (BRE), NASA Science page (verbatim excerpts)
    uri: https://science.nasa.gov/biological-physical/investigations/bre/
    section: Science Objectives; Experiment Description
    text: >
      "The Burning Rate Emulator (BRE) experiment is focused on spacecraft fire prevention." "A flat porous burner fed
      with gaseous fuel simulates the burning of solid and liquid fuels." "could provide an efficient way to screen and
      select fire-resistant materials for use in spacecraft". "enable improved fire safety on Earth".
  - title: Recent Research on Flames of Gaseous Fuel Aboard the ISS, BRE excerpts (verbatim)
    uri: https://ntrs.nasa.gov/citations/20210021781
    section: conference paper, BRE section
    text: >
      "Unlike the other ACME experiments, this study is focused on spacecraft fire prevention." "pure or
      nitrogen-diluted ethylene and methane were used to simulate the burning of materials". "Testing included
      atmospheres with elevated oxygen concentrations and reduced pressures being considered". "While the flames can
      burn for minutes in elevated oxygen concentrations"; "they were found to self-extinguish in concentrations below
      ~25% (by volume)". "larger flames were generally seen to self-extinguish within 1.5 minutes."; "methane flames were
      seen to self-extinguish within a minute."
open_questions:
  - The PSI table lists oxygen concentrations per test day but not chamber pressures; run pressures are null. The card pressure range is the set of planned atmospheres (8.2 to 14.7 psia) in the PSI objectives.
  - Rows 5 and 8 of the PSI table give oxygen as 3400% and 2100% (cell format errors); one run each with oxygen null (row 8 lists 0 flames ignited, so ignited is false).
  - Runs are one per (test day, listed oxygen value) of PSI-20_Experimental table_ACME BRE.csv; the table lists the approximate oxygen levels of the tests that ignited, so each listed value is a tested point (ignited true) rather than a continuous range. They replace the earlier per-day aggregate ranges, which implied coverage between the listed values. The number ignited per oxygen value is not given (only per day, in notes).
  - Publication years are taken from PSI titles only where given; authors follow the PSI record.
reviewed: false
