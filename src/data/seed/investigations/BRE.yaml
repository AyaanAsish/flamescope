acronym: BRE
title: Burning Rate Emulator
project: ACME
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-20
hardware:
  - {name: CIR, role: host}
  - {name: ACME insert, role: apparatus}
summary: >
  BRE, the ACME experiment focused on spacecraft fire prevention, emulated the burning of solid and liquid materials
  with gaseous fuels (pure or nitrogen-diluted ethylene and methane) fed through flat porous burners of 25 and 50 mm
  diameter in quiescent microgravity. Tests covered oxygen concentrations from 21% to 40% and reduced pressures
  considered for crewed spacecraft; flames self-extinguished below about 25% oxygen.
objectives:
  - text: BRE's objective is to improve fundamental understanding of materials flammability, such as extinction behavior [...]
    source:
      kind: document
      uri: https://science.nasa.gov/biological-physical/investigations/bre/
      title: Burning Rate Emulator (BRE) - NASA Science
      locator: Experiment Description
      quote: More specifically, BRE’s objective is to improve fundamental understanding of materials flammability, such as extinction
  - text: >
      Observe burning behavior in long-duration microgravity for CH4/N2 and C2H4/N2 mixtures on porous circular burners
      of 25 and 50 mm diameter, in O2/N2 ambients including NASA-considered atmospheres for human space missions.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-20
      title: PSI investigation PSI-20, ACME Burning Rate Emulator
      locator: Objectives (PSI repository search record, geode-py API)
      quote: "NASA - considered atmosphere for human space missions will be examined: 14.7 psia, 21 % oxygen: 10.2 psia, 26.5 %; and 8.2 psia, 34 % oxygen"
approach:
  text: A flat porous burner fed with gaseous fuel simulates the burning of solid and liquid fuels; the heat fed back to the burner is measured.
  source:
    kind: document
    uri: https://science.nasa.gov/biological-physical/investigations/bre/
    title: Burning Rate Emulator (BRE) - NASA Science
    locator: Experiment Description
    quote: A flat porous burner fed with gaseous fuel simulates the burning of solid and liquid fuels.
fuels:
  - name: ethylene
    phase: gas
    material_class: hydrocarbon gas
    geometry: {shape: flat porous circular burner, dimensions_mm: {diameter: null}}
    source: &jasmac_fuel
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210021781
      title: Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)
      locator: BRE section, conference paper full text
      quote: pure or nitrogen-diluted ethylene and methane were used to simulate the burning of materials
  - name: methane
    phase: gas
    material_class: hydrocarbon gas
    geometry: {shape: flat porous circular burner, dimensions_mm: {diameter: null}}
    source: *jasmac_fuel
conditions:
  o2_fraction:
    min: 0.21
    max: 0.4
    source:
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-20
      title: PSI-20 Experimental table (PSI-20_Experimental table_ACME BRE.csv)
      locator: column "Oxygen Conc (percent)", rows 1-18
      quote: 2019,Feb,25,25,50% C2H4,21; 26.5; 34; 40,8,
  pressure_kpa:
    min: 56.537
    max: 101.353
    source:
      <<: *psi_record
      locator: Objectives (planned atmospheres 8.2 to 14.7 psia, converted at 6.894757 kPa per psi); the experimental table states that chamber pressures were varied but does not list them
  flow_speed_cm_s: null
  flow_direction: [quiescent]
  gravity_g: [0]
variables:
  varied: [fuel, fuel dilution with nitrogen, o2_fraction, pressure_kpa, burner diameter (25 or 50 mm), fuel flow rate]
  fixed: [gravity_g, quiescent ambient]
