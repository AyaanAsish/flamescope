findings:
  - statement: BRE flames could burn for minutes at elevated oxygen concentrations but self-extinguished at oxygen concentrations below about 25% by volume.
    category: atmosphere_design
    source: &jasmac
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210021781
      title: Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)
      locator: BRE section, conference paper full text
      quote: they were found to self-extinguish in concentrations below ~25% (by volume)
    confidence: 0.75
  - statement: Larger BRE flames were generally seen to self-extinguish within 1.5 minutes, and methane flames within a minute.
    category: fundamental
    source:
      <<: *jasmac
      quote: larger flames were generally seen to self-extinguish within 1.5 minutes.
    confidence: 0.7
  - statement: Quasi-steady burning corresponding to condensed-phase materials such as PMMA and Nylon was observed with the gas-fed emulator.
    category: material_screening
    source:
      <<: *psi_record
      locator: Research Impacts/Earth Benefits (PSI repository search record, geode-py API)
      quote: Quasi-steady burning corresponding to various condensed-phase materials (such as PMMA and Nylon) was observed in
    confidence: 0.7
  - statement: Preliminary BRE results suggest NASA may want to increase use of its alternative flammability test approach for selecting spacecraft materials.
    category: material_screening
    source:
      <<: *psi_record
      locator: Research Impacts/Earth Benefits (PSI repository search record, geode-py API)
      quote: While BRE's results are still preliminary, they suggest that NASA may want to increase use of its alternative flammability
    confidence: 0.6
  - statement: BRE testing included the elevated-oxygen, reduced-pressure atmospheres being considered for crewed spacecraft, the regime where its flames burned for minutes.
    category: atmosphere_design
    source:
      <<: *jasmac
      quote: Testing included atmospheres with elevated oxygen concentrations and reduced pressures being considered
    confidence: 0.6
