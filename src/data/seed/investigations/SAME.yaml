documents:
  - title: SAME PSI overview (objective, approach, hypothesis; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-102
    section: PSI repository record
    text: >
      Smoke and Aerosol Measurement Experiment (SAME). PSI accession PSI-102; PSI dataset DOI 10.60555/gd4k-8h62.
      Project type: Microgravity Investigation; flight program: International Space Station (ISS); hardware:
      Comparitive Soot Diagnostic Hardware. Objective: "One of the major goals of this investigation was to quantify the
      sizes that the liquid smoke particulate achieves in low [gravity] [...]". "A numerical code was to be developed to
      predict the smoke droplet growth as a function of the fuel pyrolysis rate, the [...]". Approach: "The actual
      duration of each combustion event was typically 2 minutes." "The remains of the samples were weighed to determine
      their mass loss." "The digital data was transcribed from the video record and analyzed to determine the response
      of the detectors." "Once the flight mass loss rates were determined, 1-g operation conditions to produce the same
      loss were determined." Hypothesis: "The three hypotheses that motivated this investigation:" "In particular, it is
      hypothesized that liquid aerosol smokes produced in microgravity will exhibit substantially larger [...]". "The
      change in the size distribution and number density will, in turn, affect the response of the smoke detectors and
      [...]". Experimental table (PSI-102_Experimental table_SAME.csv): Teflon samples 1-4 at air flow 5, 5, 5 and 10
      cm/s, weight loss rates 2, 1, 2 and 2 mg/min and aging durations 1, 1, 20 and 1 minutes; Kapton, silicone rubber,
      lampwick and dibutyl phthalate at the same conditions as samples 1-4.
  - title: Particle and Smoke Detection on ISS for Next Generation Smoke Detectors (abstract, verbatim excerpts)
    uri: https://ntrs.nasa.gov/citations/20070031686
    section: abstract
    text: >
      "Rapid fire detection requires the ability to differentiate fire signatures from background conditions and
      nuisance [sources] [...]". "Owing to the absence of microgravity smoke data, all current spacecraft smoke detectors
      were designed based upon normal-g[ravity] [...]". "Recent space shuttle experiments confirmed that, in some cases,
      increased particles sizes are seen in low-gravity [...]". "The SAME experiment will make measurements of the
      particle size distribution of the smoke particulate from several typi[cal] [...]". "These background levels are
      critical to the design of future smoke detectors."
open_questions:
  - Cabin oxygen and pressure during the tests are not stated in the sources opened; left null.
  - The material class of lampwick and the phase of dibutyl phthalate are not stated by the sources; phase liquid is the substance's ordinary state and needs curator confirmation.
  - SAME results (particle sizes per material) were not in the sources opened for this flight; the measured size range is recorded under SAME-R.
