      quote: After flight, the particulate collected on the thermophoretic probes were analyzed using a Transmission Electron
findings:
  - statement: All spacecraft smoke detectors in use when SAME was planned had been designed from normal-gravity smoke data, because microgravity smoke data were absent.
    category: detection
    source:
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20070031686
      title: Particle and Smoke Detection on ISS for Next Generation Smoke Detectors (Urban et al., 2007)
      locator: abstract
      quote: Owing to the absence of microgravity smoke data, all current spacecraft smoke detectors were designed based upon normal-g
    confidence: 0.6
  - statement: Space shuttle experiments before SAME confirmed that, in some cases, smoke particle sizes increase in low gravity.
    category: detection
    source:
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20070031686
      title: Particle and Smoke Detection on ISS for Next Generation Smoke Detectors (Urban et al., 2007)
      locator: abstract
      quote: Recent space shuttle experiments confirmed that, in some cases, increased particles sizes are seen in low-gravity and th
    confidence: 0.6
