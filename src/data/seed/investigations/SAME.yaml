acronym: SAME
title: Smoke Aerosol Measurement Experiment
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-102
hardware:
  - {name: MSG, role: host}
  - {name: Smoke and dust instrument, role: instrument}
summary: >
  SAME measured the size of smoke particles produced by overheating (not burning) spacecraft materials in low gravity
  in the Microgravity Science Glovebox on the ISS, and how two smoke detectors responded. Teflon, Kapton, silicone
  rubber, lampwick and dibutyl phthalate samples were heated in air flows of 5 or 10 cm/s and the smoke was aged for
  1 or 20 minutes before measurement; particulate was collected for electron microscopy.
objectives:
  - text: Quantify the sizes that the liquid smoke particulate achieves in low gravity [...]
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-102
      title: PSI investigation PSI-102, Smoke and Aerosol Measurement Experiment
      locator: objective (PSI repository record, geode-py API)
      quote: One of the major goals of this investigation was to quantify the sizes that the liquid smoke particulate achieves in low
approach:
  text: >
    The crew installed the near-field hardware in the Glovebox and attached the far-field box; each smoke-generation
    event typically lasted 2 minutes; thermophoretic probe samples were analysed by transmission electron microscopy,
    sample mass loss was weighed and detector responses were read from the video record.
  source:
    <<: *psi_record
    locator: approach (PSI repository record, geode-py API)
    quote: The actual duration of each combustion event was typically 2 minutes.
