summary: >
  Saffire-I burned a large sample of Sibal cotton-fiberglass fabric (about 0.94 m long and 0.4 m wide) in a flow duct
  inside the Cygnus resupply vehicle after it left the ISS, at an air flow of 20 cm/s, to measure how fast a large fire
  grows in low gravity and to probe low-gravity flammability limits. Cameras, thermocouples, radiometers and gas
  sensors recorded the fire.
