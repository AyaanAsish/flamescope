documents:
  - title: Saffire-I PSI overview (objectives, approach, hypothesis, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-98
    section: PSI repository record
    text: >
      Spacecraft Fire Safety Experiment-I (SAFFIRE-I). PSI accession PSI-98. Project type: Microgravity Investigation;
      flight platform: International Space Station (ISS); hardware: Saffire 1 enclosure in Cygnus; sub-research area:
      Spacecraft Fire, Smoke Distribution. Objectives: "(1) determine how rapidly a large scale fire grows in
      low-gravity and (2) investigate the low-g flammability limits [...]". Approach: "The Saffire-1 experiments was
      performed on the Orbital Science's Cygnus resupply vehicle after it deberthed from the ISS." "The sample material
      for Saffire-I is a composite fabric called Sibal consisting of cotton on a fiberglass [...]". "The sample was
      approximately 0.94 meters long and 0.4 meters wide, simulating a large piece of flammable fabric." "The Saffire-1
      flight unit had a sample card installed in the middle of a large flow duct." "Saffire-I was conducted at an air
      flow velocity of 20 cm/s." "Once the sample was ignited flame images were captured using two cameras." "All data
      was compressed, and subsequently downlinked." Hypothesis: "There is a significant lack of microgravity data
      available for spacecraft designers on which to base their fire safety [...]". Research impacts: "Results
      determine microgravity flammability limits for several spacecraft materials, help to validate NASA's material
      [...]". "The investigation is crucial for the safety of current and future space missions."
open_questions:
  - Added from the PSI combustion catalog (PSI-98). The burn took place in the Cygnus vehicle after it left the ISS; platform follows the PSI flight platform (ISS).
  - The Saffire flow duct is not in hardware.yaml; hardware left empty.
  - Runs are the two samples of PSI-98_Experimental table_SAFFIRE-1.csv (S1 concurrent, S2 opposed, 20 cm/s); S1 lists oxygen as "21.5 - 21.7" percent, a stated range, so it is an aggregate run with the midpoint as its condition. The pre-test flow-visualisation rows (F1C1/F1C2, F2C1/F2C2) are not tests and are skipped.
  - The table gives sample thickness 0.37 under a "(cm)" header and length 40.6 cm by width 94 cm, while the PSI approach states about 0.94 m long and 0.4 m wide; run geometry dimensions are left empty and the cells stay in notes. Cabin pressure and flame spread rates are not in the table.
  - Publication DOIs are filled from the PSI record where it gives them.
