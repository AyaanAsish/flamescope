summary: >
  SLICE studied the structure, stability and liftoff of laminar coflow diffusion flames in microgravity using a
  fan-driven flow duct with exchangeable burner tubes. Methane, ethylene and nitrogen-diluted mixtures were burned in
  controlled coflowing air; more than 4,000 high-resolution images were captured across 13 test sessions.
objectives:
  - text: Determine the liftoff velocity limits for different fuels and burner diameters.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-106
      title: PSI investigation PSI-106, Structure and Liftoff In Combustion Experiment
      locator: objective (PSI repository record, geode-py API)
      quote: Determine the liftoff velocity limits for different fuels and burner diameters.
  - text: Evaluate the impact of fuel dilution with nitrogen on soot formation and flame stability.
    source:
      <<: *psi_record
      quote: Evaluate the impact of fuel dilution with nitrogen on soot formation and flame stability.
  - text: Quantify the effects of microgravity on flame length and radiative heat loss compared to normal gravity conditions.
    source:
      <<: *psi_record
      quote: Quantify the effects of microgravity on flame length and radiative heat loss compared to normal gravity conditions.
  - text: Validate numerical models for flame dynamics, soot production, and thermal radiation in non-premixed flames.
    source:
      <<: *psi_record
      quote: Validate numerical models for flame dynamics, soot production, and thermal radiation in non-premixed flames.
approach:
  text: >
    A fan-driven flow duct with exchangeable burner tubes and integrated sensors; methane, ethylene and nitrogen-diluted
    mixtures were ignited manually and observed in controlled coflow air, with still images and overlaid sensor data.
  source:
    <<: *psi_record
    locator: approach (PSI repository record, geode-py API)
    quote: This setup used several fuels such as methane, ethylene, and nitrogen-diluted mixtures.
