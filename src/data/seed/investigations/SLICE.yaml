documents:
  - title: SLICE PSI overview (objective, approach, hypothesis, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-106
    section: PSI repository record
    text: >
      Title: Structure and Liftoff In Combustion Experiment (SLICE). PSI accession PSI-106; PSI dataset DOI
      10.60555/pm12-rg61. Project type: Microgravity Investigation; flight program: International Space Station (ISS).
      Objective: "The objective of this investigation is to better understand the structure and stability of laminar
      diffusion [flames] [...]". "To investigate the structure of laminar diffusion flames in microgravity to understand
      the stabilizing mechanisms at the [...]". "Determine the liftoff velocity limits for different fuels and burner
      diameters." "Evaluate the impact of fuel dilution with nitrogen on soot formation and flame stability."
      "Quantify the effects of microgravity on flame length and radiative heat loss compared to normal gravity
      conditions." "Validate numerical models for flame dynamics, soot production, and thermal radiation in
      non-premixed flames." Approach: "The SLICE apparatus consisted of a fan-driven flow duct, exchangeable burner
      tubes, and integrated sensors to measure [...]". "This setup used several fuels such as methane, ethylene, and
      nitrogen-diluted mixtures." "Flames were then manually ignited and observed under controlled coflow air
      conditions." "A high resolution camera captured still images while sensor data was overlaid on these images."
      "More than 4,000 high-resolution images were captured across 13 testing experiments." "Data was then analyzed to
      correlate flame structure with stability with flow dynamics and fuel properties." Research impacts: "Improved
      numerical models for flame behavior lead to more efficient combustion technologies on Earth." "Understanding soot
      formation aids in designing combustion systems with minimum emissions." "Insights into flame stability and
      behavior to enhance fire safety." "Findings will inform the development of cleaner, more efficient engines and
      industrial burners."
open_questions:
  - Runs are the 12 test days of PSI-106_Experimental table_Slice.csv (one run per day with the fuel and nitrogen dilution named); the table states no oxygen, pressure, coflow velocity or liftoff result, so those stay null.
  - The last row (2012-MAR-23) also names SPICE testing with 100% C3H8 before the C2H4 tests; only the SLICE fuel (ethylene) is recorded as the run fuel, the cell text is kept in notes.
  - PSI leaves experiment hardware blank; the MSG and SPICE flow duct links come from the challenge text (doc 01 section 6).
  - The first publication title was only read up to "inlet" in the PSI record; the full title is to be confirmed from the DOI.
reviewed: false
