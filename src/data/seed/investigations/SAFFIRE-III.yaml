summary: >
  Saffire-III repeated the large-scale Sibal fabric burn of Saffire-I in the Cygnus vehicle after it left the ISS, at an
  air flow of 30 cm/s instead of 20 cm/s, concurrent or opposed, to measure large-fire growth in low gravity and compare
  low-gravity flammability limits with NASA's normal-gravity screening test.
objectives:
  - text: Measure how quickly a large-scale fire grows in low gravity and compare low-gravity flammability limits with those of NASA's normal-gravity material flammability screening test.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-100
      title: PSI investigation PSI-100, Spacecraft Fire Experiment-III
      locator: Objectives (PSI repository search record, geode-py API)
approach:
  text: A Sibal sample burned in the Saffire III enclosure on Cygnus after it deberthed from the ISS at a flow of 30 cm/s (compared with 20 cm/s in Saffire-I), recorded by cameras, thermocouples, radiometers and pressure, CO2 and O2 sensors.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: 30 cm/s compared to 20 cm/s during Saffire I
