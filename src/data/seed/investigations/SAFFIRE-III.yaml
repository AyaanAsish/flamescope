documents:
  - title: Saffire-III PSI overview (approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-100
    section: PSI repository record
    text: >
      Spacecraft Fire Experiment-III (SAFFIRE-III). PSI accession PSI-100. Project type: Microgravity Investigation;
      hardware: Saffire III enclosure in Cygnus; sub-research area: Spacecraft Fire Safety. The PSI record states that
      the experiment ran on the Cygnus resupply vehicle after it deberthed from the ISS, used "SIBAL" as the sample
      material as a follow-on to Saffire I, with flow at "30 cm/s compared to 20 cm/s during Saffire I", concurrent or
      opposed, and that solid-state sensors measured "pressure, CO2 and O2 mole faction." Research impacts: "Instruments
      on an unmanned cargo vessel measure oxygen, carbon dioxide, heat, pressure and flame growth, and two video [...]".
