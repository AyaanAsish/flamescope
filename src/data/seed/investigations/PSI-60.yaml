documents:
- title: PSI-60 PSI overview (objective, approach, hypothesis, research impacts; verbatim)
  uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-60
  section: PSI repository record
  text: 'Title: Computational and Experimental Analysis of SPICE Data Sets. PSI accession PSI-60; PSI dataset DOI 10.60555/mzjm-yv57.
    Project type: Ground Investigation; research area: Combustion Science; sub-research area: Gaseous; managing center: Glenn
    Research Center (GRC); funding: 80NSSC19K1634; investigation dates 06-05-2019 to 08-29-2022. Related investigations in
    PSI: PSI-107 (SPICE). Objective: "This ground investigation sought to increase understanding of the issues that control
    the large discrepancy between soot formation in 1g and in 0g flames. The objective of this investigation was to integrate
    computational and experimental methods to derive temperature distributions and soot volume fractions from the Smoke Point
    in Coflow Experiment (SPICE) data available in PSI. By analyzing over 1600 raw DSLR images and incorporating advanced
    soot models, the study sought to improve understanding of soot formation, oxidation, radiative re-absorption, and aggregate
    growth in heavily sooting flames. The work further aimed to reconcile microgravity and normal gravity flame behavior,
    identify key physical and chemical processes influencing smoke point development, and provide a framework for evaluating
    model parameter sensitivity." Approach: "The approach was to combine image processing, experimental diagnostics, and detailed
    soot modeling. Raw Nikon NEF images were decoded into three color channels and analyzed using color-ratio pyrometry to
    extract soot temperature fields. Absolute light calibration from SPICE was then used to calculate soot volume fractions.
    For computational modeling, a coupled flow–species–soot system was implemented, modified to include radiation re-absorption
    and discrete-sectional aggregate formation. Simulations were performed for both Yale and ACME burner configurations under
    normal and microgravity conditions. Comparisons between experimental data and computed results guided sensitivity analyses
    of soot evolution parameters, including the effects of radiation, scattering, boundary conditions, and heat transfer to
    the burner structure." Hypothesis: "Microgravity conditions would produce longer, more diffuse flames with lower temperatures
    and increased soot concentrations compared to normal gravity, and that careful integration of experimental temperature
    fields into the simulations would reduce discrepancies between measured and predicted soot distributions." Research impacts:
    "This study sought to enhance understanding of soot formation, flame structure, and radiative transport under microgravity
    and normal gravity, improving predictive models for combustion in both spacecraft and terrestrial systems. For space applications,
    the results support safer fire detection, suppression, and cleaner combustion technologies critical for long-duration
    missions. On Earth, the insights help reduce pollutant emissions, optimize combustion efficiency, and inform the design
    of cleaner energy and industrial systems."'
