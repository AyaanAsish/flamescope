summary: 'A PSI-funded ground investigation (Yale University, 2019-2022) that re-analysed the Smoke Point In Co-flow Experiment
  (SPICE, PSI-107) flight images: color-ratio pyrometry of raw DSLR images gave soot temperatures and, with the SPICE light
  calibration, soot volume fractions, which were compared with coupled flow-species-soot simulations of the Yale and ACME
  burners in normal and microgravity. It holds no new flight tests.'
