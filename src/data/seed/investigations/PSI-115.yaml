summary: A PSI-funded ground investigation (University of Illinois, 2017-2019) that used direct numerical simulation to study
  how gravity changes the growth of dibutyl phthalate smoke particles from a heated pyrolysis source in a geometry similar
  to the Smoke Aerosol Measurement Experiment (SAME, PSI-102), at two low cross-flow speeds in Earth gravity and microgravity.
  Its PSI data are simulation cases, not flight tests.
