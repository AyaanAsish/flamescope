findings:
  - statement: The microgravity flames showed a distinct peak ion current that corresponds to the most compact flame.
    category: fundamental
    source: &jasmac
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210021781
      title: Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)
      locator: E-FIELD Flames section, conference paper full text
      quote: the microgravity flames exhibit a distinct peak ion current that corresponds to the most compact flame
    confidence: 0.8
  - statement: Highly diluted flames could be stabilized with very weak electric fields.
    category: fundamental
    source:
      <<: *jasmac
      quote: It was found that highly diluted flames can be stabilized with very weak electric fields.
    confidence: 0.8
  - statement: The ion wind induced by an electric field can modify flame shape, alter soot and stability limits and direct heat transfer.
    category: fundamental
    source:
      kind: document
      uri: https://science.nasa.gov/biological-physical/investigations/e-field-flames/
      title: Electric-Field Effects on Laminar Diffusion Flames (E-FIELD Flames) - NASA Science
      locator: Science Objectives
      quote: The induced ion wind can modify the flame shape, alter the soot and stability limits, and direct the heat transfer.
    confidence: 0.75
