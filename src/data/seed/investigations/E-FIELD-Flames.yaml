      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-22
      title: PSI investigation PSI-22, ACME Electric-Field Effects on Laminar Diffusion Flames
      locator: Objectives (PSI repository search record, geode-py API)
      quote: The objective of this investigation is to better understand the relationship between electric field voltage and chemi-ion
  - text: Electric field on flame ions, which mimics partial gravity.
    source:
      kind: curated
      uri: https://www.spaceappschallenge.org/2026/challenges/flame-in-freefall/
      title: Challenge text as encoded in architecture doc 01 section 6
      locator: doc 01 section 6, first bullet
approach:
  text: >
    Gas-fueled flames, with and without a coflow of air (using the CLD Flame coflow burner), are subjected to a high
    voltage of up to 10 kV between the burner and a flat circular mesh above it; ion current and flame characteristics
    are measured as functions of field strength and fuel.
  source:
    kind: document
    uri: https://science.nasa.gov/biological-physical/investigations/e-field-flames/
    title: Electric-Field Effects on Laminar Diffusion Flames (E-FIELD Flames) - NASA Science
    locator: Experiment Description
    quote: An electric field is generated by creating a high voltage (up to 10 kV) differential between the burner and a flat circu
