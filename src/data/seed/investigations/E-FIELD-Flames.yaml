documents:
  - title: E-FIELD Flames PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-22
    section: PSI repository record
    text: >
      Title: Advanced Combustion via Microgravity Experiments Electric-Field Effects on Laminar Diffusion Flames (ACME
      E-FIELD Flames). PSI accession PSI-22; PSI dataset DOI 10.60555/se5a-8c73. Project type: Microgravity
      Investigation; flight platform: International Space Station (ISS); hardware: Combustion Integrated Rack (CIR),
      ACME. Objective: "The objective of this investigation is to better understand the relationship between electric
      field voltage and chemi-ion[ization] [...]". Approach: "This unique environment is ideal for isolating electric
      field effects from buoyancy forces." "The experiment is conducted with gas-fueled flames, both with and without a
      coflow of air." "An electric field is generated by creating a high voltage (up to 10 kV) differential between
      the burner and a flat [...]". Research impacts: "The use of electric fields to control flames can reduce the
      production of harmful pollutants in practical terrestrial [...]". Experimental table (PSI-22_Experimental
      table_ACME E-FIELD Flames.csv): test days in 2018 with test type (for example first round of tests with the
      coflow burner), mesh polarity, fuel bottle (100% CH4, 40% CH4, 100% C2H4 and others), fuel concentration diluted
      with nitrogen and the number of flames ignited.
  - title: E-FIELD Flames, NASA Science page (verbatim excerpts)
    uri: https://science.nasa.gov/biological-physical/investigations/e-field-flames/
    section: Science Objectives; Experiment Description; Earth Applications
    text: >
      "In this experiment, an electric field with voltages as high as 10,000 volts is established between the burner
      and a mesh [...]". "The resulting ion-driven wind can dramatically influence the stability and sooting behavior of
      the flame." "An electric field can strongly influence flames because of its effect on the ions present as a result
      of the combustion [...]". "The induced ion wind can modify the flame shape, alter the soot and stability limits,
      and direct the heat transfer." "The experiment contributes to our critical understanding of combustion processes
      in the presence of electric fields." "The experiment is conducted with gas-fueled flames, both with and without a
      coflow of air."
  - title: Recent Research on Flames of Gaseous Fuel Aboard the ISS, E-FIELD Flames excerpts (verbatim)
    uri: https://ntrs.nasa.gov/citations/20210021781
    section: conference paper, E-FIELD Flames section
    text: >
      "This experiment's purpose is to improve understanding of chemi-ionization in flames". "burning pure and diluted
      methane and ethylene with both gas-jet and coflow flame configurations". "the microgravity flames exhibit a
      distinct peak ion current that corresponds to the most compact flame". "It was found that highly diluted flames
      can be stabilized with very weak electric fields."
open_questions:
  - The partial-gravity analogue role is stated in the challenge text and supported by the PSI-listed publication on cancelling buoyancy with an ion-driven wind; no PSI field states it directly.
  - Runs are the 20 test days of PSI-22_Experimental table_ACME E-FIELD Flames.csv (continuation rows add fuel concentrations to the day above; the 18319 block is repeated verbatim at the end of the table and is imported once). Oxygen, pressure and applied voltage per test are not in the table, so condition values and e_field_kv stay null; flow direction is coflow for the coflow-burner round and null for the gas-jet round.
  - Run gravity is 0 g (PSI Microgravity Investigation); the partial-gravity analogue is a tag, not a run gravity.
  - Burner dimensions are not stated in the sources opened.
reviewed: false
