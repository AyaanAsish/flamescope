acronym: E-FIELD-Flames
title: E-FIELD Flames
project: ACME
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-22
hardware:
  - {name: CIR, role: host}
  - {name: ACME insert, role: apparatus}
summary: >
  Electric-Field Effects on Laminar Diffusion Flames (E-FIELD Flames), an ACME experiment in the Combustion Integrated
  Rack, applied up to 10 kV between the burner and a mesh above it to study how the ion-driven wind changes flame
  shape, soot, stability and heat transfer of pure and diluted methane and ethylene flames, with and without an air
  coflow. Because an ion wind can act on a flame like buoyancy, it is the partial-gravity analogue in PSI.
