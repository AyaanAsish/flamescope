documents:
  - title: BASS-II PSI overview (objectives, approach, research impacts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-25
    section: PSI repository record
    text: >
      Title: Burning and Suppression of Solids - II (BASS-II). PSI accession PSI-25. Project type: Microgravity
      Investigation; flight platform: International Space Station (ISS); hardware: Microgravity Science Glovebox (MSG).
      The PSI record describes a study of how solid fuels ignite, grow flames, spread and reach extinction limits in
      low-velocity forced flows in microgravity, linking the normal-gravity NASA-STD-6001 Test #1 method with
      ground-based microgravity tests, and providing preliminary data to the SoFIE investigators. Samples were mounted
      in a small wind tunnel that could impose "airflow speeds up to 40 cm/s", and "oxygen varied below 21%".
      Research impacts: "A primary goal of BASS-II is improved spacecraft fire safety, improved understanding of
      combustion in space and how to avoid it." "If you’re on a mission far from Earth, a fire can be catastrophic."
      "BASS-II helps engineers select the safest materials and improve firefighting methods on future space missions."
  - title: BASS-II Summary Report, NASA technical memorandum (verbatim excerpts)
    uri: https://ntrs.nasa.gov/citations/20210011385
    section: abstract and sections 1-2
    text: >
      "For the first time on ISS, BASS–II utilized MSG working volume dilution with gaseous N2." "This worked out
      extremely well for operations, and added a new vital variable, ambient O2 level, to our test matrices."
      "Readings from these sensors allow us to evaluate the completeness of the combustion." "The results showed that
      most of the tests had heat release rates well below 100 W." "A total of 126 tests were conducted as part of
      BASS–II." "varied during the testing from ambient ISS O2 levels (~21 percent O2) down to ~14 percent O2".
      "the maximum flow velocity was ~55 cm/s". "cast polymethylmethacrylate (PMMA) samples were shaped as rods of
      various diameters (6.35 to 12.7 mm)"; "thin to thick slabs (0.125 to 5 mm)"; "flat cotton-fiberglass blended
      fabric samples were also burned"; "a section of a 4-cm-diameter sphere". "the flames were burning fuel rich under
      the low-velocity forced-flow conditions". "A critical flow velocity below which steady spread cannot be sustained
      is experimentally determined". "the extinction velocity significantly increases as the O2 level is reduced".
      "This has implications for firefighting strategies in spacecraft."
  - title: "Combustion of Solids in Microgravity: Results from the BASS-II Experiment (abstract, verbatim excerpts)"
    uri: https://ntrs.nasa.gov/citations/20160000593
    section: abstract
    text: >
      "The Burning and Suppression of Solids-II (BASS-II) experiment was performed on the International Space Station."
      "Microgravity combustion tests burned thin and thick flat samples, acrylic slabs, spheres, and cylinders." "The
      samples were mounted inside a small wind tunnel which could impose air flow speeds up to 53 cms." "The flames are
      quite sensitive to air flow speed in the range 0 to 5 cms." "They can be sustained at very low flow speeds of less
      than 1 cms, when they become dim blue and stable." "There are several important implications related to
      fundamental combustion research as well as spacecraft fire safety."
open_questions:
  - The maximum flow speed differs between sources (PSI record up to 40 cm/s, ASGSR abstract 53 cm/s, summary report about 55 cm/s); the card uses the summary report value.
  - The summary report states oxygen from about 21% down to about 14%; this range is carried in the aggregate runs. The card condition keeps the PSI wording (below 21%, lower bound open) because the stated range equals the doc 04 section 4 illustrative example, which the seed test rejects (design conflict DC-52).
  - Individual runs are the 129 rows of PSI-25_Experimental table_BASS-II.csv (one per test number); oxygen is the calibrated initial O2 % by volume (0.136 to 0.222 in the table, slightly wider than the summary-report range kept on the card). The four aggregate runs from the summary report are kept because they carry the stated flow-speed range and rod diameters, which the table does not give.
  - The table gives fan and air "display" settings rather than velocities, so run flow speed is null; pressure per test is not in the table (the summary report states 1 atm for the card). Rods in the table do not say "PMMA"; they are recorded as PMMA because the summary report states the rods were PMMA, with the cell text in notes.
  - Sample shapes and sizes are parsed from the material cell (inch rod diameters converted at 25.4 mm per inch; "micron" and "mm thick" as thickness; "cm wide" as width); SIBAL widths ("2 cm SIBAL") are left out because the cell does not say which dimension is meant.
  - The table states no ignition, spread-rate or extinction result per test (cells such as "no ign at any flow" or "blowoff" stay in notes).
