acronym: BASS-II
title: Burning and Suppression of Solids - II
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-25
hardware:
  - {name: MSG, role: host}
  - {name: SPICE flow duct, role: apparatus}
summary: >
  BASS-II burned PMMA rods, slabs and spheres and cotton-fiberglass fabric in a small flow duct inside the
  Microgravity Science Glovebox on the ISS, varying flow speed and direction, sample geometry and, for the first time
  on the ISS, ambient oxygen (nitrogen dilution of the glovebox volume, from about 21% down to about 14% O2).
  126 tests mapped flame spread, extinction and the U-shaped flammability boundary at low flow speeds.
objectives:
  - text: >
      Study ignition, flame growth, spread and extinction limits of solid fuels in low-velocity forced flows in
      microgravity, bridging the normal-gravity NASA-STD-6001 Test 1 method, ground-based microgravity tests and real
      material flammability in space, with flow speed and direction, ambient oxygen and sample geometry as key variables.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-25
      title: PSI investigation PSI-25, Burning and Suppression of Solids - II
      locator: Objectives (PSI repository search record, geode-py API)
approach:
  text: >
    Samples were mounted in a small wind tunnel inside the Microgravity Science Glovebox, which supplied power, imaging
    and containment; nitrogen was added to reduce oxygen, and flame appearance, growth and spread rates were measured in
    opposed and concurrent flow.
  source:
    kind: publication
    uri: https://ntrs.nasa.gov/citations/20160000593
    title: "Combustion of Solids in Microgravity: Results from the BASS-II Experiment (Ferkul et al., 2014)"
    locator: abstract
    quote: The wind tunnel was installed in the Microgravity Science Glovebox which supplied power, imaging, and a level of
