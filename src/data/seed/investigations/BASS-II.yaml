findings:
  - statement: Flames over solid samples were very sensitive to air flow speed between 0 and 5 cm/s and could be sustained below 1 cm/s as dim blue, stable flames.
    category: fundamental
    source: &asgsr
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20160000593
      title: "Combustion of Solids in Microgravity: Results from the BASS-II Experiment (Ferkul et al., 2014)"
      locator: abstract
      quote: They can be sustained at very low flow speeds of less than 1 cms, when they become dim blue and stable.
    confidence: 0.8
  - statement: Small, dim low-flow flames are not very dangerous in themselves but can flare up quickly when the flow changes, so they matter for fire detection.
    category: detection
    source:
      <<: *asgsr
      quote: In this state they are not particularly dangerous from a fire safety perspective, but they can flare up quickly with a sud
    confidence: 0.6
  - statement: The extinction (blowoff) flow velocity increases significantly as the ambient oxygen level is reduced.
    category: atmosphere_design
    source:
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210011385
      title: Burning and Suppression of Solids-II (BASS-II) Summary Report (Olson et al., 2021)
      locator: section 2.2.5, page 25
      quote: the extinction velocity significantly increases as the O2 level is reduced
    confidence: 0.75
  - statement: Blowoff extinctions outlined a U-shaped flammability boundary in flow speed.
    category: fundamental
    source:
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210011385
      title: Burning and Suppression of Solids-II (BASS-II) Summary Report (Olson et al., 2021)
      locator: section 1.7, page 11
      quote: blowoff extinctions, that proved to be very valuable data in outlining the U-shaped flammability boundary
    confidence: 0.75
  - statement: Most BASS-II tests released well below 100 W, and the combustion products of a fire of that scale would quickly be diluted.
    category: post_fire
    source:
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210011385
      title: Burning and Suppression of Solids-II (BASS-II) Summary Report (Olson et al., 2021)
      locator: sections 1.4 and 1.6, pages 8 and 11
      quote: the combustion products from a fire of the scale of a BASS–II test would quickly be diluted
    confidence: 0.6
  - statement: Diluting the glovebox working volume with nitrogen worked well operationally and made ambient oxygen a test variable on the ISS for the first time.
    category: suppression
    source:
      <<: *sensors
      quote: For the first time on ISS, BASS-II utilized MSG working volume dilution with gaseous nitrogen (N2).
    confidence: 0.6
  - statement: Normal-gravity blowoff limits of PMMA rods agreed with BASS-II microgravity results once buoyant stretch was included, supporting a normal-gravity upward flame spread test to screen materials for microgravity flammability.
    category: material_screening
    source:
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20160012691
      title: Correlation of Normal Gravity Mixed Convection Blowoff Limits with Microgravity Forced Flow Blowoff Limits (Marcum, Olson, Ferkul, 2016)
      locator: abstract
      quote: These blowoff limits compare favorably with the BASS-II results when the buoyant stretch is included and the flow is
    confidence: 0.65
