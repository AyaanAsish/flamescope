acronym: FLEX-2
title: Flame Extinguishment Experiment - 2
project: null
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-68
hardware:
  - {name: CIR, role: host}
  - {name: MDCA, role: apparatus}
summary: >
  FLEX-2 extended the FLEX droplet-combustion results to further fuels and environmental conditions in the
  Multi-user Droplet Combustion Apparatus of the Combustion Integrated Rack on the ISS. Its PSI test matrix lists
  eight pure and mixed liquid fuels burned as 1.5 to 5 mm droplets in O2/N2 or O2/He at oxygen mole fractions of
  0.17 to 0.30, pressures of 0.5 to 3.0 atm and flow velocities of 0.1 to 5 cm/s.
objectives:
  - text: The primary goal of the FLEX-2 flight experiments is to extend the results of FLEX-1 to fuels and environmental conditions [...]
    source:
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-68
      title: PSI investigation PSI-68, Flame Extinguishment Experiment - 2
      locator: objective (PSI repository record, geode-py API)
      quote: The primary goal of the FLEX-2 flight experiments is to extend the results of FLEX-1 to fuels and environmental
approach:
  text: >
    The chamber was filled with the test atmosphere, varied in pressure between 0.5 atm and 3.0 atm and in O2
    concentration; after a settling time of about 2 minutes a predetermined amount of fuel, based on the target droplet
    size, was dispensed.
  source:
    kind: psi_page
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-68
    title: PSI investigation PSI-68, Flame Extinguishment Experiment - 2
    locator: approach (PSI repository record, geode-py API)
    quote: The chamber was filled with the appropriate atmosphere, which was varied in pressure between 0.5 atm to 3.0 atm and O2
