acronym: CLD-Flame
title: Coflow Laminar Diffusion Flame
project: ACME
platform: ISS
gravity_level: microgravity
psi_url: https://psi.nasa.gov/physci/repo/data/investigations/PSI-21
hardware:
  - {name: CIR, role: host}
  - {name: ACME insert, role: apparatus}
summary: >
  CLD Flame, an ACME experiment in the Combustion Integrated Rack, characterised weak and sooting coflow laminar
  diffusion flames of diluted methane and ethylene in an air coflow as functions of velocity and fuel dilution, to
  test computational models with improved soot sub-models. Dilution limits of both fuels were extended in
  microgravity, and the flames were taller and wider than in normal gravity.
objectives:
  - text: Characterize the behavior of weak coflow diffusion flames of methane and ethylene, as a function of velocity and fuel [...]
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-21
      title: PSI investigation PSI-21, ACME Coflow Laminar Diffusion Flame
      locator: Objectives (PSI repository search record, geode-py API)
      quote: (A) Characterize the behavior of weak coflow diffusion flames of methane and ethylene, as a function of velocity and fuel
  - text: Characterize the sooting tendencies of diffusion flames with long residence times, as a function of velocity and fuel [...]
    source:
      <<: *psi_record
      quote: (B) Characterize the sooting tendencies of diffusion flames with long residence times, as a function of velocity and fuel
approach:
  text: Methane and ethylene diffusion flames studied over a wide range of test conditions, with OH* and CH* chemiluminescence for dilute flames and soot luminosity and laser extinction for fuel-rich flames.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: Experimentally, we plan to study methane and ethylene diffusion flames over a wide range of test conditions.
fuels:
  - {name: methane, phase: gas, material_class: hydrocarbon gas, geometry: {shape: coflow burner, dimensions_mm: {}}, source: &fuels
      {kind: publication, uri: "https://ntrs.nasa.gov/citations/20210021781", title: "Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)",
       locator: "CLD Flame section, conference paper full text", quote: "the structure of diluted methane and ethylene flames in an air coflow"}}
  - {name: ethylene, phase: gas, material_class: hydrocarbon gas, geometry: {shape: coflow burner, dimensions_mm: {}}, source: *fuels}
conditions:
  o2_fraction: null
  pressure_kpa: null
  flow_speed_cm_s: null
  flow_direction: [coflow]
  gravity_g: [0]
variables:
  varied: [fuel, fuel dilution, matched fuel and coflow velocity]
  fixed: [gravity_g, air coflow]
measurements: []
findings:
  - statement: Dilution limits for both methane and ethylene coflow flames were extended in microgravity.
    category: fundamental
    source: &jasmac
      kind: publication
      uri: https://ntrs.nasa.gov/citations/20210021781
      title: Recent Research on Flames of Gaseous Fuel Aboard the International Space Station (Stocker, 2021)
      locator: CLD Flame section, conference paper full text
      quote: dilution limits for both methane and ethylene flames were extended in microgravity
    confidence: 0.8
  - statement: The microgravity coflow flames were taller and wider than their normal-gravity counterparts.
    category: fundamental
    source:
      <<: *jasmac
      quote: These microgravity flames are also taller and wider.
    confidence: 0.75
