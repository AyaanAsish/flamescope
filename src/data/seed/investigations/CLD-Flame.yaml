documents:
  - title: CLD Flame PSI overview (objectives, approach, research impacts; verbatim excerpts)
    uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-21
    section: PSI repository record
    text: >
      Advanced Combustion via Microgravity Experiments / Coflow Laminar Diffusion Flame (ACME CLD Flame). PSI accession
      PSI-21. Project type: Microgravity Investigation; flight platform: International Space Station (ISS); hardware:
      Combustion Integrated Rack (CIR), ACME. Objectives: "(A) Characterize the behavior of weak coflow diffusion flames
      of methane and ethylene, as a function of velocity and fuel [...]". "(B) Characterize the sooting tendencies of
      diffusion flames with long residence times, as a function of velocity and fuel [...]". Approach: "The enhanced
      time and spatial scales in a microgravity environment will be important for achieving both goals."
      "Experimentally, we plan to study methane and ethylene diffusion flames over a wide range of test conditions."
      Research impacts: "Diffusion flames are the flame type of most practical combustion devices."
  - title: Recent Research on Flames of Gaseous Fuel Aboard the ISS, CLD Flame excerpts (verbatim)
    uri: https://ntrs.nasa.gov/citations/20210021781
    section: conference paper, CLD Flame section
    text: >
      "This investigation's objective is to extend the range of flame conditions that can be accurately predicted".
      "the structure of diluted methane and ethylene flames in an air coflow". "The dependence of normal coflow flames on
      injection velocity and fuel dilution is carefully examined". "in an air coflow, where the fuel and air velocities
      are typically matched". "dilution limits for both methane and ethylene flames were extended in microgravity".
      "These microgravity flames are also taller and wider." ISS operations: "Nov. 2017–Feb. 2018"; "May-Sept. 2018";
      "Feb.-March 2021".
open_questions:
  - Added from the PSI combustion catalog (PSI-21); the acronym key CLD-Flame replaces the spaced PSI name so it is a valid URL key.
  - Runs are the 32 test days of PSI-21_Experimental table_CLD Flame.csv; each carries the fuel concentration range of that day (nitrogen dilution, volume basis) as varied_parameters.fuel_mole_fraction and the maximum MFC flows (slpm, nitrogen basis) as fixed parameters. The table states no oxygen, pressure or coflow velocity, so those stay null.
  - The Fuel Bottle cells increment (CH5 to CH14, C2H5 to C2H11), a spreadsheet fill artefact; the fuel is taken from the Test Type column (methane or ethylene) and, for "Improved coflow tests", from the bottle prefix (C2H -> ethylene, CH -> methane); the cell text stays in notes.
  - Publications are the PSI record list; years are taken from PSI titles only where given.
