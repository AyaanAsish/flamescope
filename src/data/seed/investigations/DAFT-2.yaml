summary: >
  DAFT-2, held in PSI together with DAFT, continued the microgravity tests of a TSI P-Trak particle counter modified to
  recycle its alcohol by capillary forces, reducing risk for the Smoke Aerosol Measurement Experiment (SAME). Arizona
  Red Dust aerosol served as the standard and a DustTrak as the control.
objectives:
  - text: DAFT / DAFT-2 tests that a modified P-Trak particulate counter would be accurate in microgravity.
    source: &psi_record
      kind: psi_page
      uri: https://psi.nasa.gov/physci/repo/data/investigations/PSI-47
      title: PSI investigation PSI-47, Dust and Aerosol Measurement Feasibility Test / DAFT-2
      locator: Objectives (PSI repository search record, geode-py API)
      quote: DAFT / DAFT-2 tests that a modified P-Trak particulate counter would be accurate in microgravity.
approach:
  text: >
    The TSI P-Trak was modified for microgravity by redesigning its condenser tube; Arizona Red Dust aerosolized with
    gaseous nitrogen provided particle samples, and on orbit the modified counter was compared with a DustTrak.
  source:
    <<: *psi_record
    locator: Approach (PSI repository search record, geode-py API)
    quote: The ARD was aerosolized with GN2 to create particle samples.
