    text: >
      Dust and Aerosol Measurement Feasibility Test / Dust and Aerosol Measurement Feasibility Test-2 (DAFT / DAFT-2).
      PSI accession PSI-47. Project type: Microgravity Investigation; hardware: TSI P-Trak. Objectives: "The focus of
      DAFT / DAFT-2 was to mitigate the risk for the Smoke Aerosol Measurement Experiment (SAME)." "DAFT / DAFT-2 tests
      that a modified P-Trak particulate counter would be accurate in microgravity." Approach: "2) Aerosol Generation:
      Arizona Red Dust (ARD) was chosen as an aerosol standard due to its ease of dispersion." "The ARD was aerosolized
      with GN2 to create particle samples." Research impacts: "This research will impact the development of novel fire
      and smoke detection systems for the International Space Station [...]". "Additionally, the successful adaptation
      of the TSI P-Trak for microgravity can inform the design of instruments for use [...]".
