# Fuel name normalization vocabulary (doc 06 section 3.5). Entries map fuel names and aliases to a
# phase and material class. This is a naming vocabulary only; it does not state that any
# investigation burned a given fuel (the investigation seed files carry those facts with sources).
# phase: gas | liquid | solid
reviewed: false
fuels:
  - name: PMMA
    phase: solid
    material_class: polymer
    aliases: [polymethyl methacrylate, polymethylmethacrylate, acrylic]
  - name: n-heptane
    phase: liquid
    material_class: alkane
    aliases: [heptane]
