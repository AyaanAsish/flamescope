open_questions:
  - Classes for hydrogen, hydrogen / methane, dimethyl ether, dibutyl phthalate, lampwick, Nomex, Ultem and the waxes are not set here; no source opened states one, so the investigation files keep them null.
  - The phases of dimethyl ether (gas) and dibutyl phthalate (liquid) follow the investigation cards and need curator confirmation.
